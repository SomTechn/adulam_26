<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ADULAM · Reset</title>
<style>body{font-family:system-ui;max-width:440px;margin:50px auto;padding:20px;text-align:center}h1{color:#4f46e5;margin-bottom:4px}#s{background:#0f172a;color:#4ade80;padding:16px;border-radius:12px;margin:20px 0;text-align:left;font-size:13px;font-family:monospace;line-height:1.7;white-space:pre-wrap;min-height:120px}</style></head>
<body><h1>ADULAM</h1><p style="color:#64748b;margin-top:0">Limpieza completa del navegador</p><div id="s">Iniciando...</div>
<script>
(async function(){
  var s=document.getElementById('s'),l='';
  function m(t,ok){l+=(ok?'[OK] ':'[!] ')+t+'\n';s.textContent=l;}
  try{var r=await navigator.serviceWorker.getRegistrations();for(var x of r)await x.unregister();m(r.length+' Service Workers eliminados',true);}catch(e){m('SW: '+e.message,false);}
  try{var k=await caches.keys();for(var c of k)await caches.delete(c);m(k.length+' cachés borrados',true);}catch(e){m('Cache: '+e.message,false);}
  try{var n=localStorage.length;localStorage.clear();m(n+' items de localStorage borrados',true);}catch(e){m('LS: '+e.message,false);}
  try{sessionStorage.clear();m('sessionStorage limpio',true);}catch(e){}
  try{var dbs=await indexedDB.databases();for(var d of dbs){indexedDB.deleteDatabase(d.name);}m(dbs.length+' bases IndexedDB borradas',true);}catch(e){}
  l+='\nLimpieza completa. Redirigiendo al login en 3s...';s.textContent=l;
  setTimeout(function(){var p=window.location.pathname;window.location.href=p.substring(0,p.lastIndexOf('/')+1)+'login.html';},3000);
})();
</script></body></html>
