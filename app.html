<script>
/* =====================================================================
   ADULAM v4 · App autocontenida — solo fetch, sin librerías de auth
   ===================================================================== */
var URL_BASE = "https://nswgxgcibleayhmvajqr.supabase.co";
var ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zd2d4Z2NpYmxlYXlobXZhanFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMzA0MDksImV4cCI6MjEwMTgwNjQwOX0.Ir2JnuGPHFjW8rwaPUC6QcVwhjJkAL1dRr8XTo4iWvY";
var STORE = "adulam_v4_session";

var S = { session:null, user:null, profile:null, cache:{} };

/* ---------- utilidades ---------- */
function ri(){ if(window.lucide) lucide.createIcons(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function fecha(f){ if(!f) return '-'; try{ return new Date(f).toLocaleDateString('es-HN',{day:'2-digit',month:'2-digit',year:'numeric'}); }catch(e){return '-';} }
function dinero(n){ if(n==null) return 'L 0.00'; return 'L '+Number(n).toLocaleString('es-HN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function hoy(){ return new Date().toISOString().slice(0,10); }

function toast(msg,tipo){
  var c={success:'bg-emerald-600',error:'bg-red-600',info:'bg-slate-800',warning:'bg-amber-600'};
  var t=document.createElement('div');
  t.className='fixed top-4 left-1/2 -translate-x-1/2 z-[60] px-5 py-3 rounded-full text-white text-sm font-medium shadow-2xl max-w-[90vw] afi '+(c[tipo]||c.info);
  t.textContent=msg; document.body.appendChild(t);
  setTimeout(function(){ t.style.opacity='0'; },2600);
  setTimeout(function(){ t.remove(); },3000);
}

function modal(id,html){
  var m=document.getElementById(id);
  if(!m){ m=document.createElement('div'); m.id=id; m.className='fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm'; document.body.appendChild(m); }
  m.innerHTML='<div class="bg-white w-full sm:max-w-lg sm:w-[92%] sm:rounded-2xl rounded-t-2xl max-h-[92vh] overflow-y-auto shadow-2xl asu">'+html+'</div>';
  m.onclick=function(e){ if(e.target===m) closeModal(id); };
  document.body.style.overflow='hidden'; setTimeout(ri,30);
}
function closeModal(id){ var m=document.getElementById(id); if(m) m.remove(); document.body.style.overflow=''; }
function mHead(t,id){ return '<div class="sticky top-0 bg-white border-b border-slate-200 p-4 flex items-center justify-between z-10"><h3 class="text-lg font-bold">'+t+'</h3><button type="button" onclick="closeModal(\''+id+'\')" class="p-2 hover:bg-slate-100 rounded-lg"><i data-lucide="x" class="w-5 h-5"></i></button></div>'; }
function mFoot(id,txt){ return '<div class="flex gap-2 pt-2"><button type="button" onclick="closeModal(\''+id+'\')" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 rounded-xl font-medium">Cancelar</button><button type="submit" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold">'+(txt||'Guardar')+'</button></div>'; }
function vacio(icon,txt){ return '<div class="col-span-full text-center py-12 text-slate-400"><i data-lucide="'+icon+'" class="w-12 h-12 mx-auto mb-3 opacity-40"></i><p>'+txt+'</p></div>'; }

/* ---------- capa de red (fetch con timeout) ---------- */
function req(path, opts, ms){
  ms = ms || 12000;
  opts = opts || {};
  var ctrl = new AbortController();
  var timer = setTimeout(function(){ ctrl.abort(); }, ms);
  opts.signal = ctrl.signal;
  opts.headers = opts.headers || {};
  opts.headers.apikey = ANON;
  if (S.session && S.session.access_token) opts.headers.Authorization = 'Bearer '+S.session.access_token;
  return fetch(URL_BASE+path, opts)
    .then(function(r){ clearTimeout(timer); return r; })
    .catch(function(e){ clearTimeout(timer); throw new Error(e.name==='AbortError'?'Tiempo de espera agotado':e.message); });
}

/* db: helpers PostgREST */
async function dbGet(tabla, query){
  var r = await req('/rest/v1/'+tabla+(query?'?'+query:''), { headers:{ 'Accept':'application/json' } });
  if(!r.ok){ var e=await r.text(); throw new Error(e); }
  return r.json();
}
async function dbPost(tabla, body, prefer){
  var r = await req('/rest/v1/'+tabla, { method:'POST', headers:{ 'Content-Type':'application/json', 'Prefer': prefer||'return=representation' }, body: JSON.stringify(body) });
  if(!r.ok){ var e=await r.text(); throw new Error(e); }
  var t = await r.text(); return t?JSON.parse(t):null;
}
async function dbPatch(tabla, query, body){
  var r = await req('/rest/v1/'+tabla+'?'+query, { method:'PATCH', headers:{ 'Content-Type':'application/json', 'Prefer':'return=representation' }, body: JSON.stringify(body) });
  if(!r.ok){ var e=await r.text(); throw new Error(e); }
  var t = await r.text(); return t?JSON.parse(t):null;
}
async function dbDel(tabla, query){
  var r = await req('/rest/v1/'+tabla+'?'+query, { method:'DELETE', headers:{'Prefer':'return=minimal'} });
  if(!r.ok){ var e=await r.text(); throw new Error(e); }
  return true;
}
async function dbUpsert(tabla, body, onConflict){
  var r = await req('/rest/v1/'+tabla+(onConflict?'?on_conflict='+onConflict:''), {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates,return=representation' },
    body: JSON.stringify(body)
  });
  if(!r.ok){ var e=await r.text(); throw new Error(e); }
  var t=await r.text(); return t?JSON.parse(t):null;
}

/* ---------- sesión ---------- */
function saveSession(s){ try{ localStorage.setItem(STORE, JSON.stringify(s)); }catch(e){} S.session=s; }
function loadSession(){ try{ var r=localStorage.getItem(STORE); if(!r) return null; var s=JSON.parse(r); return (s&&s.access_token)?s:null; }catch(e){ return null; } }
function clearSession(){
  try{
    localStorage.removeItem(STORE);
    Object.keys(localStorage).forEach(function(k){ if(k.indexOf('sb-')===0||k.indexOf('supabase')!==-1||k.indexOf('adulam')===0) localStorage.removeItem(k); });
  }catch(e){}
  S.session=null; S.user=null; S.profile=null;
}
function expirada(s){ return !s || !s.expires_at || (Date.now()/1000) > (s.expires_at-60); }

async function login(email, pass){
  var r = await req('/auth/v1/token?grant_type=password', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ email:email, password:pass })
  }, 15000);
  var d = await r.json();
  if(!r.ok) throw new Error(d.error_description||d.msg||d.message||'Credenciales inválidas');
  d.expires_at = Math.floor(Date.now()/1000)+(d.expires_in||3600);
  saveSession(d); S.user=d.user;
  await cargarPerfil();
  return d;
}
async function registrar(email, pass, nombre){
  var r = await req('/auth/v1/signup', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ email:email, password:pass, data:{ nombre:nombre, rol:'miembro' } })
  }, 15000);
  var d = await r.json();
  if(!r.ok) throw new Error(d.error_description||d.msg||d.message||'No se pudo registrar');
  return d;
}
async function refrescar(rt){
  try{
    var r = await req('/auth/v1/token?grant_type=refresh_token', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ refresh_token: rt })
    }, 10000);
    if(!r.ok) return null;
    var d = await r.json();
    if(!d.access_token) return null;
    d.expires_at = Math.floor(Date.now()/1000)+(d.expires_in||3600);
    saveSession(d); return d;
  }catch(e){ return null; }
}
async function cargarPerfil(){
  if(!S.user) return null;
  var fb = { id:S.user.id, nombre:(S.user.user_metadata&&S.user.user_metadata.nombre)||(S.user.email||'').split('@')[0], email:S.user.email, rol:'miembro' };
  try{
    var rows = await dbGet('profiles','id=eq.'+S.user.id+'&select=*');
    S.profile = (rows&&rows[0]) ? rows[0] : fb;
  }catch(e){ S.profile = fb; }
  return S.profile;
}
async function logout(){
  try{ await req('/auth/v1/logout',{method:'POST'},5000); }catch(e){}
  clearSession(); location.reload();
}
function rol(){ return S.profile ? S.profile.rol : 'miembro'; }
function puede(roles){ return roles.indexOf(rol())!==-1; }

  { id:'dashboard',    icon:'layout-dashboard', label:'Dashboard',      roles:['pastor','lider','servidor','miembro'] },

var vistaActual='dashboard';

function openNav(){ document.getElementById('sidebar').classList.remove('-translate-x-full'); document.getElementById('ovl').classList.remove('hidden'); document.body.style.overflow='hidden'; }
function closeNav(){ document.getElementById('sidebar').classList.add('-translate-x-full'); document.getElementById('ovl').classList.add('hidden'); document.body.style.overflow=''; }

function pintarMenu(){
  var r = rol();
  document.getElementById('navMenu').innerHTML = MENU.filter(function(m){ return m.roles.indexOf(r)!==-1; }).map(function(m){
    var act = vistaActual===m.id;
    return '<button onclick="ir(\''+m.id+'\')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition text-left '+(act?'bg-indigo-600 text-white font-semibold':'text-slate-700 hover:bg-slate-100')+'"><i data-lucide="'+m.icon+'" class="w-5 h-5 flex-shrink-0"></i><span class="truncate">'+m.label+'</span></button>';
  }).join('');
  var bn=[{id:'dashboard',icon:'layout-dashboard',l:'Inicio'},{id:'members',icon:'users',l:'Miembros'},{id:'attendance',icon:'clipboard-check',l:'Asist.'},{id:'services',icon:'calendar-days',l:'Cultos'}];
  document.getElementById('bottomnav').innerHTML = bn.map(function(m){
    var act=vistaActual===m.id;
    return '<button onclick="ir(\''+m.id+'\')" class="flex flex-col items-center gap-0.5 flex-1 py-2 '+(act?'text-indigo-600':'text-slate-500')+'"><i data-lucide="'+m.icon+'" class="w-5 h-5"></i><span class="text-[10px] font-medium">'+m.l+'</span></button>';
  }).join('');
  ri();
}

function ir(id){
  var m = MENU.filter(function(x){ return x.id===id; })[0];
  if(m && !puede(m.roles)){ toast('Sin permiso para esta sección','warning'); return; }
  vistaActual = id;
  closeNav();
  document.getElementById('pageTitle').textContent = m ? m.label : '';
  document.getElementById('page').innerHTML = '<div class="text-center py-12 text-slate-400"><i data-lucide="loader-circle" class="w-8 h-8 mx-auto animate-spin"></i></div>';
  ri(); pintarMenu();
  var fn = window['view_'+id];
  if(fn) fn().catch(function(e){ errorPagina(e); });
  else document.getElementById('page').innerHTML = vacio('construction','Módulo en desarrollo.');
}

function errorPagina(e){
  document.getElementById('page').innerHTML =
    '<div class="bg-red-50 border border-red-200 rounded-2xl p-5"><h3 class="font-bold text-red-800 mb-1">Ocurrió un error</h3>'+
    '<p class="text-sm text-red-700 font-mono break-words">'+esc(e.message||e)+'</p>'+
    '<button onclick="ir(vistaActual)" class="mt-3 px-4 py-2 bg-red-600 text-white rounded-lg text-sm font-medium">Reintentar</button></div>';
  console.error(e);
}

/* ---------- catálogos en caché ---------- */
async function cat(nombre, query){
  if(S.cache[nombre]) return S.cache[nombre];
  S.cache[nombre] = await dbGet(nombre, query);
  return S.cache[nombre];
}
function limpiarCache(n){ if(n) delete S.cache[n]; else S.cache={}; }

   '<p class="text-sm text-slate-500 mt-0.5">Panorama general de ADULAM</p></div>'+
   '<div id="stats" class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-3 mb-6"></div>'+

var COL_EST={nuevo:'bg-blue-100 text-blue-700',discipulado:'bg-violet-100 text-violet-700',bautizado:'bg-emerald-100 text-emerald-700',lider:'bg-amber-100 text-amber-700',inactivo:'bg-slate-200 text-slate-600'};

   '<div class="flex flex-col sm:flex-row gap-2 mb-4">'+
     '<div class="relative flex-1"><i data-lucide="search" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>'+

async function pintarMiembros(){
  var q=(document.getElementById('mBuscar').value||'').trim().toLowerCase();
  var est=document.getElementById('mEstado').value;
  var query='select=*,families(nombre_familia),member_teams(teams(id,nombre)),member_houses(houses(id,nombre))&order=nombre';
  if(est) query+='&estado_espiritual=eq.'+est;
  var d = await dbGet('members', query);
  if(q) d=d.filter(function(m){ return (m.nombre||'').toLowerCase().indexOf(q)!==-1 || (m.telefono||'').toLowerCase().indexOf(q)!==-1; });
  var L=document.getElementById('mLista');
  if(!d.length){ L.innerHTML=vacio('users','Sin miembros registrados.'); ri(); return; }
  L.innerHTML = d.map(function(m){
    var mins=(m.member_teams||[]).map(function(t){return t.teams?t.teams.nombre:null;}).filter(Boolean);
    var cas=(m.member_houses||[]).map(function(h){return h.houses?h.houses.nombre:null;}).filter(Boolean);
    return '<div class="bg-white rounded-2xl border border-slate-200 p-3 sm:p-4 flex items-center gap-3 hover:shadow-md transition">'+
      '<div class="w-12 h-12 rounded-full bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-white font-bold text-lg overflow-hidden flex-shrink-0">'+
        (m.foto_url?'<img src="'+esc(m.foto_url)+'" class="w-full h-full object-cover">':esc((m.nombre||'?')[0].toUpperCase()))+'</div>'+
      '<div class="flex-1 min-w-0 cursor-pointer" onclick="perfilMiembro(\''+m.id+'\')">'+
        '<div class="font-semibold text-slate-800 truncate">'+esc(m.nombre)+'</div>'+
        '<div class="text-xs text-slate-500 flex flex-wrap gap-x-3">'+
          (m.telefono?'<span>'+esc(m.telefono)+'</span>':'')+
          (m.families?'<span>'+esc(m.families.nombre_familia)+'</span>':'')+
          (mins.length?'<span>'+esc(mins.slice(0,2).join(', '))+'</span>':'')+
          (cas.length?'<span>'+esc(cas.slice(0,1).join(', '))+'</span>':'')+
        '</div>'+
        '<span class="inline-block mt-1 px-2 py-0.5 text-[10px] font-semibold rounded-full '+(COL_EST[m.estado_espiritual]||'')+'">'+esc(m.estado_espiritual)+'</span>'+
      '</div>'+
      '<div class="flex flex-col gap-1 flex-shrink-0">'+
        (puede(['pastor','lider','servidor'])?'<button onclick="editarMiembro(\''+m.id+'\')" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600"><i data-lucide="pencil" class="w-4 h-4"></i></button>':'')+
        (puede(['pastor'])?'<button onclick="borrarMiembro(\''+m.id+'\',\''+esc(m.nombre).replace(/'/g,"")+'\')" class="p-2 hover:bg-red-100 rounded-lg text-red-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button>':'')+
      '</div></div>';
  }).join('');
  ri();
}

async function editarMiembro(id){
  var d = await dbGet('members','id=eq.'+id+'&select=*,member_teams(team_id),member_houses(house_id)');
  formMiembro(d[0]);
}

function formMiembro(m){
  m=m||{};
  var ta=(m.member_teams||[]).map(function(x){return x.team_id;});
  var ha=(m.member_houses||[]).map(function(x){return x.house_id;});
  var fams=S.cache.families||[], teams=S.cache.teams||[], houses=S.cache.houses||[];
  var html = mHead((m.id?'Editar':'Nuevo')+' miembro','mM')+
   '<form id="fM" class="p-4 space-y-4">'+
   '<div><label class="text-sm font-medium text-slate-700">Nombre completo *</label><input name="nombre" required value="'+esc(m.nombre||'')+'" class="w-full mt-1 px-3 py-2.5 border border-slate-300 rounded-lg"></div>'+
   '<div class="grid grid-cols-2 gap-3">'+
     '<div><label class="text-sm font-medium text-slate-700">Teléfono</label><input name="telefono" inputmode="tel" value="'+esc(m.telefono||'')+'" class="w-full mt-1 px-3 py-2.5 border border-slate-300 rounded-lg"></div>'+
     '<div><label class="text-sm font-medium text-slate-700">Nacimiento</label><input name="fecha_nacimiento" type="date" value="'+esc(m.fecha_nacimiento||'')+'" class="w-full mt-1 px-3 py-2.5 border border-slate-300 rounded-lg"></div>'+
   '</div>'+
   '<div><label class="text-sm font-medium text-slate-700">Dirección</label><input name="direccion" value="'+esc(m.direccion||'')+'" class="w-full mt-1 px-3 py-2.5 border border-slate-300 rounded-lg"></div>'+
   '<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">'+
     '<div><label class="text-sm font-medium text-slate-700">Familia</label><select name="familia_id" class="w-full mt-1 px-3 py-2.5 border border-slate-300 rounded-lg"><option value="">Sin asignar</option>'+
       fams.map(function(f){return '<option value="'+f.id+'"'+(m.familia_id===f.id?' selected':'')+'>'+esc(f.nombre_familia)+'</option>';}).join('')+'</select></div>'+
     '<div><label class="text-sm font-medium text-slate-700">Estado espiritual</label><select name="estado_espiritual" class="w-full mt-1 px-3 py-2.5 border border-slate-300 rounded-lg">'+
       ESTADOS.map(function(e){return '<option value="'+e+'"'+(m.estado_espiritual===e?' selected':'')+'>'+e+'</option>';}).join('')+'</select></div>'+
   '</div>'+
   '<div><label class="text-sm font-medium text-slate-700 flex items-center gap-1.5"><i data-lucide="target" class="w-4 h-4"></i>Ministerios <span class="text-xs text-slate-400 font-normal">(varios)</span></label>'+
     '<div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5 mt-1 max-h-36 overflow-y-auto border border-slate-200 rounded-lg p-1.5">'+
     (teams.length?teams.map(function(t){return '<label class="flex items-center gap-2 p-2.5 bg-slate-50 hover:bg-indigo-50 rounded-lg cursor-pointer"><input type="checkbox" name="teams" value="'+t.id+'"'+(ta.indexOf(t.id)!==-1?' checked':'')+' class="accent-indigo-600 w-4 h-4"><span class="text-sm">'+esc(t.nombre)+'</span></label>';}).join(''):'<p class="text-xs text-slate-400 p-2">Sin ministerios creados.</p>')+
     '</div></div>'+
   '<div><label class="text-sm font-medium text-slate-700 flex items-center gap-1.5"><i data-lucide="wheat" class="w-4 h-4"></i>Casas de Pan <span class="text-xs text-slate-400 font-normal">(varias)</span></label>'+
     '<div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5 mt-1 max-h-36 overflow-y-auto border border-slate-200 rounded-lg p-1.5">'+
     (houses.length?houses.map(function(h){return '<label class="flex items-center gap-2 p-2.5 bg-slate-50 hover:bg-amber-50 rounded-lg cursor-pointer"><input type="checkbox" name="houses" value="'+h.id+'"'+(ha.indexOf(h.id)!==-1?' checked':'')+' class="accent-amber-600 w-4 h-4"><span class="text-sm">'+esc(h.nombre)+'</span></label>';}).join(''):'<p class="text-xs text-slate-400 p-2">Sin casas creadas.</p>')+
     '</div></div>'+
   '<div><label class="text-sm font-medium text-slate-700">Foto (máx 2MB)</label><input name="foto" type="file" accept="image/*" class="w-full mt-1 text-sm file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-indigo-50 file:text-indigo-700">'+
     (m.foto_url?'<img src="'+esc(m.foto_url)+'" class="w-16 h-16 rounded-full object-cover mt-2">':'')+'</div>'+
   '<div><label class="text-sm font-medium text-slate-700">Notas</label><textarea name="notas" rows="2" class="w-full mt-1 px-3 py-2.5 border border-slate-300 rounded-lg">'+esc(m.notas||'')+'</textarea></div>'+
   mFoot('mM')+'</form>';
  modal('mM',html);

  document.getElementById('fM').onsubmit = async function(e){
    e.preventDefault();
    var btn=e.target.querySelector('button[type=submit]');
    btn.disabled=true; btn.textContent='Guardando...';
    try{
      var fd=new FormData(e.target);
      var body={ nombre:fd.get('nombre'), telefono:fd.get('telefono')||null, direccion:fd.get('direccion')||null,
        familia_id:fd.get('familia_id')||null, estado_espiritual:fd.get('estado_espiritual'),
        fecha_nacimiento:fd.get('fecha_nacimiento')||null, notas:fd.get('notas')||null };

      var foto=fd.get('foto');
      if(foto && foto.size>0){
        if(foto.size>2*1024*1024){ toast('La foto supera 2MB, se guarda sin foto','warning'); }
        else {
          // La foto NUNCA debe impedir guardar al miembro
          try{
            var ext=(foto.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)||'jpg';
            var path='members/'+Date.now()+'_'+Math.random().toString(36).slice(2,8)+'.'+ext;
            var up=await req('/storage/v1/object/member-photos/'+path,{ method:'POST', headers:{'Content-Type':foto.type||'image/jpeg'}, body:foto },20000);
            if(up.ok) body.foto_url=URL_BASE+'/storage/v1/object/public/member-photos/'+path;
            else toast('No se pudo subir la foto, se guarda sin ella','warning');
          }catch(fe){ toast('Foto no subida ('+fe.message.slice(0,40)+'), se guarda sin ella','warning'); }
        }
      }

      var mid=m.id;
      if(mid){ await dbPatch('members','id=eq.'+mid, body); }
      else { var res=await dbPost('members', body); mid=res[0].id; }

      var ts=Array.prototype.slice.call(e.target.querySelectorAll('input[name=teams]:checked')).map(function(c){return c.value;});
      var hs=Array.prototype.slice.call(e.target.querySelectorAll('input[name=houses]:checked')).map(function(c){return c.value;});
      await dbDel('member_teams','member_id=eq.'+mid);
      if(ts.length) await dbPost('member_teams', ts.map(function(t){return {member_id:mid,team_id:t};}), 'return=minimal');
      await dbDel('member_houses','member_id=eq.'+mid);
      if(hs.length) await dbPost('member_houses', hs.map(function(h){return {member_id:mid,house_id:h};}), 'return=minimal');

      toast('Miembro guardado','success'); closeModal('mM'); pintarMiembros();
    }catch(err){ toast(err.message.slice(0,120),'error'); btn.disabled=false; btn.textContent='Guardar'; }
  };
}

async function borrarMiembro(id,nombre){
  if(!confirm('¿Eliminar a '+nombre+'?')) return;
  try{ await dbDel('members','id=eq.'+id); toast('Eliminado','success'); pintarMiembros(); }
  catch(e){ toast(e.message.slice(0,120),'error'); }
}

      (d.families?'<div><b>Familia:</b> '+esc(d.families.nombre_familia)+'</div>':'')+
      (mins.length?'<div><b>Ministerios:</b> '+esc(mins.join(', '))+'</div>':'')+
      (cas.length?'<div><b>Casas de Pan:</b> '+esc(cas.join(', '))+'</div>':'')+
      (d.notas?'<div><b>Notas:</b> '+esc(d.notas)+'</div>':'')+'</div>'+
      '<div class="mt-4"><h4 class="font-semibold mb-2">Últimas asistencias</h4><div class="bg-white border border-slate-200 rounded-xl p-3">'+asis+'</div></div>'+
      '<button onclick="closeModal(\'mP\')" class="mt-4 w-full py-3 bg-slate-100 rounded-xl font-medium">Cerrar</button></div>');
  }catch(e){ toast(e.message.slice(0,120),'error'); }

async function pintarFamilias(){
  var fams=await dbGet('families','select=*&order=nombre_familia');
  var mem=await dbGet('members','select=id,nombre,familia_id');
  limpiarCache('families');
  var g=document.getElementById('fGrid');
  if(!fams.length){ g.innerHTML=vacio('home','Sin familias registradas.'); ri(); return; }
  g.innerHTML=fams.map(function(f){
    var ints=mem.filter(function(m){return m.familia_id===f.id;});
    return '<div class="bg-white rounded-2xl border border-slate-200 p-5"><div class="flex items-start justify-between mb-3">'+
      '<div class="flex items-center gap-2"><div class="w-10 h-10 rounded-xl bg-indigo-100 text-indigo-700 flex items-center justify-center"><i data-lucide="home" class="w-5 h-5"></i></div>'+
      '<h4 class="font-bold text-slate-800">'+esc(f.nombre_familia)+'</h4></div>'+
      '<div class="flex gap-1">'+(puede(['pastor','lider','servidor'])?'<button onclick="formFamilia({id:\''+f.id+'\',nombre_familia:\''+esc(f.nombre_familia).replace(/'/g,"")+'\'})" class="p-1.5 hover:bg-slate-100 rounded-lg"><i data-lucide="pencil" class="w-4 h-4"></i></button>':'')+
      (puede(['pastor'])?'<button onclick="borrarFamilia(\''+f.id+'\',\''+esc(f.nombre_familia).replace(/'/g,"")+'\')" class="p-1.5 text-red-600 hover:bg-red-100 rounded-lg"><i data-lucide="trash-2" class="w-4 h-4"></i></button>':'')+'</div></div>'+
      '<p class="text-xs text-slate-500 mb-3">'+ints.length+' integrante'+(ints.length!==1?'s':'')+'</p>'+
      '<div class="space-y-1">'+ints.slice(0,5).map(function(m){return '<div class="text-sm text-slate-700 flex items-center gap-1.5"><i data-lucide="user" class="w-3 h-3 text-slate-400"></i>'+esc(m.nombre)+'</div>';}).join('')+
      (ints.length>5?'<div class="text-xs text-slate-400 pl-4">+'+(ints.length-5)+' más</div>':'')+'</div></div>';
  }).join('');
  ri();
}
function formFamilia(f){
  f=f||{};
  modal('mF', mHead((f.id?'Editar':'Nueva')+' familia','mF')+
    '<form id="fF" class="p-4 space-y-3"><div><label class="text-sm font-medium">Nombre de la familia *</label>'+
    '<input name="nombre_familia" required value="'+esc(f.nombre_familia||'')+'" class="w-full mt-1 px-3 py-2.5 border border-slate-300 rounded-lg"></div>'+mFoot('mF')+'</form>');
  document.getElementById('fF').onsubmit=async function(e){
    e.preventDefault();
    try{
      var v=new FormData(e.target).get('nombre_familia');
      if(f.id) await dbPatch('families','id=eq.'+f.id,{nombre_familia:v});
      else await dbPost('families',{nombre_familia:v});
      limpiarCache('families'); toast('Guardado','success'); closeModal('mF'); pintarFamilias();
    }catch(err){ toast(err.message.slice(0,120),'error'); }
  };

async function cargarServiciosDia(){
  var f=document.getElementById('aFecha').value;
  var c=document.getElementById('aServicios');
  if(!f){ c.innerHTML=''; return; }
  var sv=await dbGet('service_plans','fecha=eq.'+f+'&select=*,meeting_types(nombre,icono)&order=created_at');
  if(!sv.length){
    c.innerHTML='<div class="bg-amber-50 border border-amber-200 rounded-2xl p-5 text-center">'+
      '<i data-lucide="calendar-off" class="w-10 h-10 mx-auto text-amber-500 mb-2"></i>'+
      '<p class="text-amber-900 mb-3">No hay servicios planificados para esta fecha.</p>'+
      '<button onclick="ir(\'services\')" class="inline-flex items-center gap-2 px-4 py-2.5 bg-amber-600 hover:bg-amber-700 text-white rounded-xl font-semibold"><i data-lucide="plus" class="w-4 h-4"></i>Crear servicio</button></div>';
    document.getElementById('aPanel').classList.add('hidden'); A.servicio=null; ri(); return;
  }
  c.innerHTML='<div class="bg-white rounded-2xl border border-slate-200 p-4">'+
    '<div class="text-sm font-medium text-slate-600 mb-3">'+(sv.length===1?'Servicio del día:':sv.length+' servicios — selecciona cuál registrar:')+'</div>'+
    '<div class="grid gap-2 sm:grid-cols-2 lg:grid-cols-3">'+sv.map(function(s){
      var act=A.servicio&&A.servicio.id===s.id;
      return '<button onclick="elegirServicio(\''+s.id+'\')" class="text-left p-3 rounded-xl border-2 transition active:scale-[.98] '+(act?'border-indigo-600 bg-indigo-50':'border-slate-200 bg-white hover:border-indigo-300')+'">'+
        '<div class="flex items-center gap-2"><div class="w-10 h-10 rounded-lg bg-indigo-100 flex items-center justify-center text-xl flex-shrink-0">'+esc(s.meeting_types?s.meeting_types.icono:'⛪')+'</div>'+
        '<div class="flex-1 min-w-0"><div class="font-bold truncate">'+esc(s.meeting_types?s.meeting_types.nombre:s.tipo_reunion)+'</div>'+
        (s.tema?'<div class="text-xs text-slate-500 truncate">'+esc(s.tema)+'</div>':'')+'</div>'+
        (act?'<i data-lucide="check-circle-2" class="w-5 h-5 text-indigo-600"></i>':'')+'</div></button>';
    }).join('')+'</div>'+
    '<p class="text-xs text-slate-500 mt-3 flex items-start gap-1"><i data-lucide="info" class="w-3.5 h-3.5 mt-0.5 flex-shrink-0"></i>Un miembro puede asistir a varios servicios el mismo día.</p></div>';
  ri();
  if(sv.length===1 && !A.servicio) elegirServicio(sv[0].id, sv);
  else if(A.servicio){ var u=sv.filter(function(s){return s.id===A.servicio.id;})[0]; if(u) elegirServicio(u.id, sv); else { A.servicio=null; document.getElementById('aPanel').classList.add('hidden'); } }
}

async function elegirServicio(id, lista){
  if(lista) A.servicio=lista.filter(function(s){return s.id===id;})[0];
  else A.servicio=(await dbGet('service_plans','id=eq.'+id+'&select=*,meeting_types(nombre,icono)'))[0];
  await cargarServiciosDia();
  var att=await dbGet('attendance','fecha=eq.'+A.servicio.fecha+'&meeting_type_id=eq.'+A.servicio.meeting_type_id+'&select=*');
  A.mapa={}; att.forEach(function(a){ A.mapa[a.member_id]=a; });
  document.getElementById('aPanel').classList.remove('hidden');
  pintarAsistencia();
}

function filtrarMiembros(){
  var q=(document.getElementById('aBuscar').value||'').trim().toLowerCase();
  var fam=document.getElementById('aFam').value, cas=document.getElementById('aCasa').value;
  var l=A.miembros;
  if(q) l=l.filter(function(m){return (m.nombre||'').toLowerCase().indexOf(q)!==-1;});
  if(fam) l=l.filter(function(m){return m.familia_id===fam;});
  if(cas) l=l.filter(function(m){return (m.member_houses||[]).some(function(h){return h.house_id===cas;});});
  return l;
}

function pintarAsistencia(){
  if(!A.servicio) return;
  var fl=filtrarMiembros(), tot=A.miembros.length;
  var pres=0; for(var k in A.mapa){ if(A.mapa[k].asistio) pres++; }
  var mt=A.servicio.meeting_types;
  document.getElementById('aReporte').innerHTML=
    '<div class="bg-gradient-to-r from-indigo-600 to-violet-700 text-white rounded-2xl p-4 mb-3">'+
    '<div class="text-xs opacity-80 uppercase tracking-wide">Registrando asistencia</div>'+
    '<div class="text-lg font-bold">'+esc(mt?mt.icono:'⛪')+' '+esc(mt?mt.nombre:A.servicio.tipo_reunion)+'</div>'+
    (A.servicio.tema?'<div class="text-sm opacity-90 mt-1">'+esc(A.servicio.tema)+'</div>':'')+'</div>'+
    '<div class="bg-white border border-slate-200 rounded-2xl p-4 grid grid-cols-2 sm:grid-cols-4 gap-3">'+
    '<div><div class="text-xs text-slate-500">Total</div><div class="text-xl font-bold">'+tot+'</div></div>'+
    '<div><div class="text-xs text-slate-500">Presentes</div><div class="text-xl font-bold text-emerald-600">'+pres+'</div></div>'+
    '<div><div class="text-xs text-slate-500">Ausentes</div><div class="text-xl font-bold text-red-600">'+(tot-pres)+'</div></div>'+
    '<div><div class="text-xs text-slate-500">% Asist.</div><div class="text-xl font-bold text-indigo-600">'+(tot?Math.round(pres/tot*100):0)+'%</div></div></div>';
  var L=document.getElementById('aLista');
  if(!fl.length){ L.innerHTML='<p class="text-slate-400 text-center py-6">Sin miembros que coincidan.</p>'; return; }
  L.innerHTML='<div class="text-xs text-slate-500 mb-2">Mostrando '+fl.length+' de '+tot+'</div>'+
    fl.map(function(m){
      var a=A.mapa[m.id], ok=a?a.asistio:false;
      return '<label class="bg-white rounded-xl border p-3 flex items-center gap-3 cursor-pointer hover:bg-slate-50 transition '+(ok?'border-emerald-300 bg-emerald-50':'border-slate-200')+'">'+
        '<div class="w-10 h-10 rounded-full bg-indigo-500 flex items-center justify-center text-white font-bold overflow-hidden flex-shrink-0">'+
        (m.foto_url?'<img src="'+esc(m.foto_url)+'" class="w-full h-full object-cover">':esc(m.nombre[0].toUpperCase()))+'</div>'+
        '<div class="flex-1 min-w-0"><div class="font-medium text-slate-800 truncate">'+esc(m.nombre)+'</div>'+
        (m.families?'<div class="text-xs text-slate-500 truncate">'+esc(m.families.nombre_familia)+'</div>':'')+'</div>'+
        '<input type="checkbox" '+(ok?'checked':'')+' onchange="marcarUno(\''+m.id+'\',this.checked)" class="w-6 h-6 accent-emerald-600 flex-shrink-0"></label>';
    }).join('');
  ri();
}

async function marcarUno(mid, ok){
  if(!A.servicio) return;
  var row={ member_id:mid, fecha:A.servicio.fecha, meeting_type_id:A.servicio.meeting_type_id, tipo_reunion:A.servicio.tipo_reunion, asistio:ok };
  try{
    await dbUpsert('attendance',[row],'member_id,fecha,tipo_reunion');
    A.mapa[mid]=row; pintarAsistencia();
  }catch(e){ toast(e.message.slice(0,120),'error'); }
}
async function marcarTodos(ok){
  if(!A.servicio) return;
  var vis=filtrarMiembros();
  if(!vis.length) return;
  if(!confirm('¿'+(ok?'Marcar':'Desmarcar')+' asistencia de '+vis.length+' miembros?')) return;
  var rows=vis.map(function(m){ return { member_id:m.id, fecha:A.servicio.fecha, meeting_type_id:A.servicio.meeting_type_id, tipo_reunion:A.servicio.tipo_reunion, asistio:ok }; });
  try{
    await dbUpsert('attendance',rows,'member_id,fecha,tipo_reunion');
    rows.forEach(function(r){ A.mapa[r.member_id]=r; });
    toast(rows.length+' actualizados','success'); pintarAsistencia();
  }catch(e){ toast(e.message.slice(0,150),'error'); }
}

async function pintarPlanes(){
  var pl=await dbGet('service_plans','select=*,meeting_types(codigo,nombre,icono)&order=fecha.desc&limit=20');
  var L=document.getElementById('sLista');
  if(!pl.length){ L.innerHTML=vacio('calendar-days','Sin servicios planificados.'); ri(); return; }
  var tasks=await dbGet('service_tasks','select=*,members(nombre)&order=created_at');
  L.innerHTML=pl.map(function(p){
    var mine=tasks.filter(function(t){return t.service_plan_id===p.id;});
    var pend=mine.filter(function(t){return t.estado==='pendiente';});
    var proc=mine.filter(function(t){return t.estado==='en_proceso';});
    var comp=mine.filter(function(t){return t.estado==='completado';});
    var mt=p.meeting_types;
    function col(tit,color,ic,items){
      return '<div class="flex-1 min-w-[210px]"><div class="font-semibold text-'+color+'-700 mb-2 flex items-center gap-1.5 text-sm"><i data-lucide="'+ic+'" class="w-4 h-4"></i>'+tit+' ('+items.length+')</div><div class="space-y-2">'+
        (items.length?items.map(function(t){
          return '<div class="bg-white border border-'+color+'-200 rounded-xl p-3 text-sm"><div class="font-medium">'+esc(t.nombre_tarea)+'</div>'+
            '<div class="text-xs text-slate-500 flex items-center gap-1 mt-0.5"><i data-lucide="user" class="w-3 h-3"></i>'+esc(t.members?t.members.nombre:'Sin asignar')+'</div>'+
            '<div class="flex gap-1 mt-2 np">'+
            (t.estado!=='pendiente'?'<button onclick="estadoTarea(\''+t.id+'\',\'pendiente\')" class="text-xs px-2 py-1 bg-slate-100 rounded"><i data-lucide="pause" class="w-3 h-3"></i></button>':'')+
            (t.estado!=='en_proceso'?'<button onclick="estadoTarea(\''+t.id+'\',\'en_proceso\')" class="text-xs px-2 py-1 bg-amber-100 rounded"><i data-lucide="play" class="w-3 h-3"></i></button>':'')+
            (t.estado!=='completado'?'<button onclick="estadoTarea(\''+t.id+'\',\'completado\')" class="text-xs px-2 py-1 bg-emerald-100 rounded"><i data-lucide="check" class="w-3 h-3"></i></button>':'')+
            '<button onclick="borrarTarea(\''+t.id+'\')" class="text-xs px-2 py-1 bg-red-100 rounded ml-auto"><i data-lucide="trash-2" class="w-3 h-3"></i></button>'+
            '</div></div>';
        }).join(''):'<p class="text-xs text-slate-400 italic">Vacío</p>')+'</div></div>';
    }
    return '<div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5">'+
      '<div class="flex items-start justify-between mb-4 flex-wrap gap-2">'+
      '<div class="min-w-0 flex-1"><h4 class="text-base sm:text-lg font-bold text-slate-800">'+esc(mt?mt.icono:'⛪')+' '+fecha(p.fecha)+' · '+esc(mt?mt.nombre:p.tipo_reunion)+'</h4>'+
      (p.tema?'<p class="text-sm text-slate-500 mt-0.5">'+esc(p.tema)+'</p>':'')+
      (p.predicador?'<p class="text-sm text-slate-500">'+esc(p.predicador)+'</p>':'')+'</div>'+
      '<div class="flex gap-1 np">'+
      '<button onclick="compartirPlan(\''+p.id+'\')" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm rounded-lg font-medium flex items-center gap-1"><i data-lucide="share-2" class="w-3.5 h-3.5"></i><span class="hidden sm:inline">Compartir</span></button>'+
      (puede(['pastor','lider','servidor'])?'<button onclick="formTarea(\''+p.id+'\')" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-700 text-white text-sm rounded-lg font-medium flex items-center gap-1"><i data-lucide="plus" class="w-3.5 h-3.5"></i><span class="hidden sm:inline">Tarea</span></button>':'')+
      (puede(['pastor'])?'<button onclick="borrarPlan(\''+p.id+'\')" class="px-3 py-1.5 bg-red-100 hover:bg-red-200 text-red-700 text-sm rounded-lg"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>':'')+
      '</div></div>'+
      '<div class="flex gap-3 overflow-x-auto pb-2">'+col('Pendiente','slate','clock',pend)+col('En proceso','amber','loader',proc)+col('Completado','emerald','check-circle-2',comp)+'</div></div>';
  }).join('');
  ri();
}

async function compartirPlan(id){
  try{
    var p=(await dbGet('service_plans','id=eq.'+id+'&select=*,meeting_types(nombre,icono)'))[0];
    var ts=await dbGet('service_tasks','service_plan_id=eq.'+id+'&select=*,members(nombre)&order=created_at');
    var f=new Date(p.fecha+'T12:00:00').toLocaleDateString('es-HN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    var mt=p.meeting_types;
    var filas = ts.length ? ts.map(function(t){
      return '<div class="bg-white/10 rounded-xl p-3 flex items-center justify-between gap-2"><div class="min-w-0"><div class="font-semibold text-white text-sm">'+esc(t.nombre_tarea)+'</div>'+
        '<div class="text-xs text-white/80">'+esc(t.members?t.members.nombre:'Sin asignar')+'</div></div>'+
        '<div class="text-lg">'+(t.estado==='completado'?'✓':(t.estado==='en_proceso'?'◐':'○'))+'</div></div>';
    }).join('') : '<p class="text-white/80 text-center italic text-sm">Sin tareas asignadas</p>';

    window._compartir = { fecha:f, tipo:(mt?mt.nombre:p.tipo_reunion), tema:p.tema, pred:p.predicador,
      tareas: ts.map(function(t){ return { n:t.nombre_tarea, r:(t.members?t.members.nombre:null) }; }) };

    modal('mC','<div id="flyer" class="flyer text-white p-6 sm:p-8">'+
      '<div class="text-center mb-4"><div class="text-xs uppercase tracking-widest opacity-80 mb-1">Iglesia ADULAM</div>'+
      '<div class="text-4xl mb-2">'+esc(mt?mt.icono:'⛪')+'</div>'+
      '<h2 class="text-2xl sm:text-3xl font-bold leading-tight">'+esc(mt?mt.nombre:p.tipo_reunion)+'</h2>'+
      '<p class="text-base mt-1 capitalize">'+esc(f)+'</p></div>'+
      (p.tema?'<div class="bg-white/15 rounded-xl p-3 text-center mb-4"><div class="text-xs uppercase opacity-80">Tema</div><div class="text-lg font-semibold">'+esc(p.tema)+'</div></div>':'')+
      (p.predicador?'<div class="text-center mb-4"><div class="text-xs uppercase opacity-80">Ministra</div><div class="text-base font-semibold">'+esc(p.predicador)+'</div></div>':'')+
      '<div class="border-t border-white/20 pt-4"><div class="text-xs uppercase tracking-wider opacity-80 mb-3 text-center">Organización</div>'+
      '<div class="space-y-2">'+filas+'</div></div>'+
      '<div class="text-center mt-5 text-xs opacity-70">Compartido desde ADULAM</div></div>'+
      '<div class="p-4 flex flex-col sm:flex-row gap-2 bg-slate-100 np">'+
      '<button onclick="descargarFlyer()" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold flex items-center justify-center gap-2"><i data-lucide="download" class="w-4 h-4"></i>Descargar imagen</button>'+
      '<button onclick="copiarTextoPlan()" class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-semibold flex items-center justify-center gap-2"><i data-lucide="clipboard" class="w-4 h-4"></i>Copiar texto</button>'+
      '<button onclick="closeModal(\'mC\')" class="py-3 px-6 bg-slate-300 rounded-xl">Cerrar</button></div>');
  }catch(e){ toast(e.message.slice(0,120),'error'); }
}
function copiarTextoPlan(){
  var d=window._compartir; if(!d) return;
  var t='*IGLESIA ADULAM*\n\n'+d.fecha+'\n'+d.tipo+'\n';
  if(d.tema) t+='\nTema: *'+d.tema+'*\n';
  if(d.pred) t+='Ministra: '+d.pred+'\n';
  t+='\n*Organización del servicio:*\n';
  d.tareas.forEach(function(x){ t+='• '+x.n+': '+(x.r||'sin asignar')+'\n'; });
  t+='\n_Bendiciones. ¡Te esperamos!_';
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(function(){ toast('Texto copiado','success'); }).catch(function(){ prompt('Copia manualmente:',t); });
  else prompt('Copia manualmente:',t);
}
async function descargarFlyer(){
  toast('Generando imagen...','info');
  try{
    if(!window.html2canvas){
      await new Promise(function(res,rej){ var s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
    }
    var el=document.getElementById('flyer');
    var cv=await html2canvas(el,{scale:2,backgroundColor:null,useCORS:true});
    cv.toBlob(function(b){ var u=URL.createObjectURL(b); var a=document.createElement('a'); a.href=u; a.download='servicio-adulam-'+hoy()+'.png'; a.click(); URL.revokeObjectURL(u); toast('Imagen descargada','success'); });
  }catch(e){ toast('No se pudo generar: '+e.message.slice(0,80),'error'); }
}

async function pintarTesoreria(){

  var ini=mes+'-01', fin=new Date(a,m,0).toISOString().slice(0,10);
  var d=await dbGet('treasury','fecha=gte.'+ini+'&fecha=lte.'+fin+'&select=*&order=fecha.desc');
  var ing=0,egr=0; d.forEach(function(r){ if(r.tipo==='ingreso') ing+=Number(r.monto); else egr+=Number(r.monto); });

    '<div class="bg-white rounded-2xl border border-emerald-200 p-4"><div class="flex items-center gap-2 text-sm text-slate-500 mb-1"><i data-lucide="trending-up" class="w-4 h-4 text-emerald-600"></i>Ingresos</div><div class="text-xl sm:text-2xl font-bold text-emerald-600">'+dinero(ing)+'</div></div>'+

  c.innerHTML='<div class="bg-white rounded-2xl border border-slate-200 divide-y divide-slate-100">'+d.map(function(r){

async function agregarParticipantes(cid){
  var ex=await dbGet('discipleship_participants','cohort_id=eq.'+cid+'&select=member_id');
  var ya={}; ex.forEach(function(e){ ya[e.member_id]=1; });
  var mem=await cat('members','select=id,nombre&order=nombre');
  var disp=mem.filter(function(m){ return !ya[m.id]; });
  if(!disp.length){ toast('Todos los miembros ya están inscritos','info'); return; }
  modal('mAP', mHead('Agregar participantes','mAP')+'<div class="p-4">'+
    '<div class="relative mb-3"><i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>'+
    '<input id="fltP" placeholder="Filtrar..." class="w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-lg"></div>'+
    '<div id="listP" class="max-h-80 overflow-y-auto border border-slate-200 rounded-xl p-2 space-y-1">'+
    disp.map(function(m){ return '<label class="flex items-center gap-2 p-3 hover:bg-indigo-50 rounded-lg cursor-pointer"><input type="checkbox" value="'+m.id+'" class="chkP accent-indigo-600 w-4 h-4"><span class="text-sm">'+esc(m.nombre)+'</span></label>'; }).join('')+

    '<button onclick="guardarParticipantes(\''+cid+'\')" class="flex-1 py-3 bg-violet-600 hover:bg-violet-700 text-white rounded-xl font-semibold">Agregar</button></div></div>');

async function guardarParticipantes(cid){
  var ids=Array.prototype.slice.call(document.querySelectorAll('.chkP:checked')).map(function(c){return c.value;});
  if(!ids.length){ toast('Selecciona al menos uno','warning'); return; }
  try{
    await dbPost('discipleship_participants', ids.map(function(m){ return { cohort_id:cid, member_id:m }; }), 'return=minimal');
    toast(ids.length+' agregados','success'); closeModal('mAP'); verPromo(cid);
  }catch(e){ toast(e.message.slice(0,150),'error'); }
}

  catch(e){ toast(e.message.slice(0,150),'error'); }
}
async function guardarNota(pid,val){
  try{ await dbPatch('discipleship_participants','id=eq.'+pid,{ nota_final: val===''?null:parseFloat(val) }); toast('Nota guardada','success'); }
  catch(e){ toast(e.message.slice(0,120),'error'); }
}
async function calcularAprobacion(cid){
  if(!confirm('¿Calcular aprobación según % de asistencia y nota mínima del curso?')) return;
  try{
    var pr=await dbGet('v_discipleship_progress','cohort_id=eq.'+cid+'&select=*');
    for(var i=0;i<pr.length;i++){
      var x=pr[i];
      var ap=(x.porcentaje_asistencia>=x.curso_min_asistencia) && ((x.nota_final==null?-1:x.nota_final)>=x.curso_nota_minima);
      await dbPatch('discipleship_participants','id=eq.'+x.participant_id,{aprobado:ap});
    }
    toast('Aprobación calculada','success'); verPromo(cid);
  }catch(e){ toast(e.message.slice(0,120),'error'); }
}
async function quitarParticipante(pid,cid){ if(!confirm('¿Quitar a este participante?'))return; try{ await dbDel('discipleship_participants','id=eq.'+pid); toast('Eliminado','success'); verPromo(cid); }catch(e){ toast(e.message.slice(0,120),'error'); } }

  var c=document.getElementById('auLogs');
  if(!d.length){ c.innerHTML='<div class="bg-white rounded-2xl border p-8 text-center text-slate-400"><i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2 opacity-40"></i><p>Sin alertas registradas.</p></div>'; ri(); return; }
  var ic={inactividad:'user-minus',sin_discipulador:'alert-triangle',nuevo_miembro:'sparkles'};
  c.innerHTML=d.map(function(l){
    return '<div class="bg-white border border-slate-200 rounded-xl p-3 flex items-start gap-3">'+
      '<div class="w-9 h-9 rounded-lg bg-slate-100 text-slate-600 flex items-center justify-center flex-shrink-0"><i data-lucide="'+(ic[l.tipo]||'bell')+'" class="w-4 h-4"></i></div>'+
      '<div class="flex-1 min-w-0"><div class="text-sm text-slate-700">'+esc(l.mensaje)+'</div>'+
      '<div class="text-xs text-slate-400 flex flex-wrap gap-x-3 mt-1"><span>'+fecha(l.created_at)+'</span>'+
      (l.members?'<span>'+esc(l.members.nombre)+'</span>':'')+
      (l.members&&l.members.telefono?'<span>'+esc(l.members.telefono)+'</span>':'')+'</div></div>'+
      '<div class="flex flex-col items-end gap-1 flex-shrink-0"><span class="text-xs '+(l.enviado?'text-emerald-600':'text-amber-600')+'">'+(l.enviado?'Enviado':'Pendiente')+'</span>'+
      (!l.enviado?'<button onclick="marcarEnviado(\''+l.id+'\')" class="text-xs px-2 py-1 bg-emerald-100 text-emerald-700 rounded">Marcar</button>':'')+'</div></div>';
  }).join('');
  ri();
}
async function marcarEnviado(id){ try{ await dbPatch('automation_logs','id=eq.'+id,{enviado:true}); pintarLogs(); }catch(e){ toast(e.message.slice(0,120),'error'); } }

/* =====================================================================
   ARRANQUE
   ===================================================================== */
function mostrar(vista){
  document.getElementById('loaderView').classList.add('hidden');
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('appView').classList.add('hidden');
  document.getElementById(vista).classList.remove('hidden');
  if(vista==='appView') document.getElementById('appView').classList.add('flex');
  ri();
}

function mostrarLogin(){ mostrar('loginView'); }

async function entrarApp(){
  document.getElementById('userName').textContent = S.profile.nombre||'Usuario';
  document.getElementById('userRole').textContent = S.profile.rol||'miembro';
  document.getElementById('avatarIni').textContent = (S.profile.nombre||'U')[0].toUpperCase();
  mostrar('appView');
  pintarMenu();
  ir('dashboard');
}

/* Tabs del login */
document.getElementById('tabL').onclick=function(){
  this.className='flex-1 py-2.5 font-semibold text-sm rounded-lg bg-white text-indigo-700 shadow-sm';
  document.getElementById('tabR').className='flex-1 py-2.5 font-semibold text-sm rounded-lg text-slate-500';
  document.getElementById('formL').classList.remove('hidden');
  document.getElementById('formR').classList.add('hidden');
  document.getElementById('loginMsg').textContent='';
};
document.getElementById('tabR').onclick=function(){
  this.className='flex-1 py-2.5 font-semibold text-sm rounded-lg bg-white text-indigo-700 shadow-sm';
  document.getElementById('tabL').className='flex-1 py-2.5 font-semibold text-sm rounded-lg text-slate-500';
  document.getElementById('formR').classList.remove('hidden');
  document.getElementById('formL').classList.add('hidden');
  document.getElementById('loginMsg').textContent='';
};
document.getElementById('formL').onsubmit=async function(e){
  e.preventDefault();
  var msg=document.getElementById('loginMsg');
  msg.innerHTML='<span class="text-slate-500">Entrando...</span>';
  try{
    await login(document.getElementById('lEmail').value, document.getElementById('lPass').value);
    await entrarApp();
  }catch(err){ msg.innerHTML='<span class="text-red-600">'+esc(err.message)+'</span>'; }
};
document.getElementById('formR').onsubmit=async function(e){
  e.preventDefault();
  var msg=document.getElementById('loginMsg');
  msg.innerHTML='<span class="text-slate-500">Creando cuenta...</span>';
  try{
    await registrar(document.getElementById('rEmail').value, document.getElementById('rPass').value, document.getElementById('rNom').value);
    msg.innerHTML='<span class="text-emerald-600">Cuenta creada. Ya puedes iniciar sesión.</span>';
  }catch(err){ msg.innerHTML='<span class="text-red-600">'+esc(err.message)+'</span>'; }
};

/* Inicio */
(async function init(){
  ri();
  var lm=document.getElementById('loaderMsg');

  // Aviso: la app debe abrirse por http(s), no como archivo local
  var org = window.location.protocol;
  if(org !== 'http:' && org !== 'https:'){
    document.getElementById('loaderView').innerHTML =
      '<div class="max-w-md mx-auto p-6 text-center">'+
      '<div class="w-14 h-14 rounded-2xl bg-red-100 text-red-600 flex items-center justify-center mx-auto mb-4"><i data-lucide="alert-triangle" class="w-7 h-7"></i></div>'+
      '<h2 class="text-xl font-bold text-slate-800 mb-2">Abre la app desde su dirección web</h2>'+
      '<p class="text-sm text-slate-600 mb-4">Estás abriendo el archivo descargado (<code>'+org+'</code>). Desde ahí el navegador bloquea la conexión con la base de datos.</p>'+
      '<p class="text-sm text-slate-700 font-medium mb-2">Entra a esta dirección:</p>'+
      '<div class="bg-slate-100 rounded-xl p-3 text-sm font-mono break-all mb-4">https://somtechn.github.io/adulam_26/app.html</div>'+
      '<p class="text-xs text-slate-500">Consejo: agrégala a tu pantalla de inicio para abrirla como app.</p></div>';
    ri();
    return;
  }

  try{
    var s=loadSession();
    if(!s){ mostrarLogin(); return; }
    lm.textContent='Verificando sesión...';
    if(expirada(s)){
      if(!s.refresh_token){ clearSession(); mostrarLogin(); return; }
      lm.textContent='Renovando sesión...';
      var f=await refrescar(s.refresh_token);
      if(!f){ clearSession(); mostrarLogin(); return; }
      s=f;
    }
    S.session=s; S.user=s.user;
    lm.textContent='Cargando perfil...';
    await cargarPerfil();
    await entrarApp();
  }catch(e){
    console.error(e);
    clearSession();
    mostrarLogin();
    setTimeout(function(){ toast('Sesión reiniciada: '+e.message.slice(0,60),'warning'); },400);
  }
})();
</script>
