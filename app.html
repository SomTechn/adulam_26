/* ---------- utilidades ---------- */
function ri(){ if(window.lucide) lucide.createIcons(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function fecha(f){ if(!f) return '-'; try{ return new Date(f).toLocaleDateString('es-HN',{day:'2-digit',month:'2-digit',year:'numeric'}); }catch(e){return '-';} }
function dinero(n){ if(n==null) return 'L 0.00'; return 'L '+Number(n).toLocaleString('es-HN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function edadRango(fnac){
  if(!fnac) return {edad:null,rango:'Sin fecha',color:'slate'};
  var hoy=new Date(), n=new Date(fnac+'T00:00:00');
  var e=hoy.getFullYear()-n.getFullYear(), m=hoy.getMonth()-n.getMonth();
  if(m<0||(m===0&&hoy.getDate()<n.getDate())) e--;
  if(e<0) return {edad:null,rango:'Sin fecha',color:'slate'};
  var r,c;
  if(e<=11){r='Niños';c='sky';}
  else if(e<=17){r='Adolescentes';c='teal';}
  else if(e<=29){r='Jóvenes';c='indigo';}
  else if(e<=39){r='Adultos jóvenes';c='violet';}
  else if(e<=59){r='Adultos';c='amber';}
  else{r='Adultos mayores';c='rose';}
  return {edad:e,rango:r,color:c};
}
function hoy(){ return new Date().toISOString().slice(0,10); }
function nomShow(m){ if(!m) return ''; var d=m.nombre_display; return (d&&(''+d).trim())?(''+d).trim():(m.nombre||''); }

function toast(msg,tipo){
  var c={success:'bg-emerald-600',error:'bg-red-600',info:'bg-slate-800',warning:'bg-amber-600'};
  var t=document.createElement('div');
  t.className='fixed top-4 left-1/2 -translate-x-1/2 z-[60] px-5 py-3 rounded-full text-white text-sm font-medium shadow-2xl max-w-[90vw] afi '+(c[tipo]||c.info);
  t.textContent=msg; document.body.appendChild(t);
  setTimeout(function(){ t.style.opacity='0'; },2600);
  setTimeout(function(){ t.remove(); },3000);
}

function modal(id,html){
  var m=document.getElementById(id);
  if(!m){ m=document.createElement('div'); m.id=id; m.className='fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm'; document.body.appendChild(m); }
  m.innerHTML='<div class="bg-white w-full sm:max-w-lg sm:w-[92%] sm:rounded-2xl rounded-t-2xl max-h-[92vh] overflow-y-auto shadow-2xl asu">'+html+'</div>';
  m.onclick=function(e){ if(e.target===m) closeModal(id); };
  document.body.style.overflow='hidden'; setTimeout(ri,30);
}
function closeModal(id){ var m=document.getElementById(id); if(m) m.remove(); document.body.style.overflow=''; }
function mHead(t,id){ return '<div class="sticky top-0 bg-white border-b border-slate-200 p-4 flex items-center justify-between z-10"><h3 class="text-lg font-bold">'+t+'</h3><button type="button" onclick="closeModal(\''+id+'\')" class="p-2 hover:bg-slate-100 rounded-lg"><i data-lucide="x" class="w-5 h-5"></i></button></div>'; }

/* ---------- capa de red (fetch con timeout) ---------- */
function req(path, opts, ms){
  ms = ms || 12000;
  opts = opts || {};
  var ctrl = new AbortController();
  var timer = setTimeout(function(){ ctrl.abort(); }, ms);
  opts.signal = ctrl.signal;
  opts.headers = opts.headers || {};
  opts.headers.apikey = ANON;
  if (S.session && S.session.access_token) opts.headers.Authorization = 'Bearer '+S.session.access_token;
  return fetch(URL_BASE+path, opts)
    .then(function(r){ clearTimeout(timer); return r; })
    .catch(function(e){ clearTimeout(timer); throw new Error(e.name==='AbortError'?'Tiempo de espera agotado':e.message); });
}

/* db: helpers PostgREST */
async function dbGet(tabla, query){
  var r = await req('/rest/v1/'+tabla+(query?'?'+query:''), { headers:{ 'Accept':'application/json' } });
  if(!r.ok){ var e=await r.text(); throw new Error(e); }
  return r.json();
}
async function dbPost(tabla, body, prefer){
  var r = await req('/rest/v1/'+tabla, { method:'POST', headers:{ 'Content-Type':'application/json', 'Prefer': prefer||'return=representation' }, body: JSON.stringify(body) });
  if(!r.ok){ var e=await r.text(); throw new Error(e); }
  var t = await r.text(); return t?JSON.parse(t):null;
}
async function rpcJson(fn, params){
  var r = await req('/rest/v1/rpc/'+fn, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(params||{}) });
  if(!r.ok){ throw new Error(await r.text()); }
  return r.json();
}
async function dbPatch(tabla, query, body){
  var r = await req('/rest/v1/'+tabla+'?'+query, { method:'PATCH', headers:{ 'Content-Type':'application/json', 'Prefer':'return=representation' }, body: JSON.stringify(body) });
  if(!r.ok){ var e=await r.text(); throw new Error(e); }
  var t = await r.text(); return t?JSON.parse(t):null;
}
async function dbDel(tabla, query){
  var r = await req('/rest/v1/'+tabla+'?'+query, { method:'DELETE', headers:{'Prefer':'return=minimal'} });
  if(!r.ok){ var e=await r.text(); throw new Error(e); }
  return true;
}
async function dbUpsert(tabla, body, onConflict){
  var r = await req('/rest/v1/'+tabla+(onConflict?'?on_conflict='+onConflict:''), {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates,return=representation' },
    body: JSON.stringify(body)
  });
  if(!r.ok){ var e=await r.text(); throw new Error(e); }
  var t=await r.text(); return t?JSON.parse(t):null;
}

/* ---------- sesión ---------- */
function saveSession(s){ try{ localStorage.setItem(STORE, JSON.stringify(s)); }catch(e){} S.session=s; }
function loadSession(){ try{ var r=localStorage.getItem(STORE); if(!r) return null; var s=JSON.parse(r); return (s&&s.access_token)?s:null; }catch(e){ return null; } }
function clearSession(){
  try{
    localStorage.removeItem(STORE);
    Object.keys(localStorage).forEach(function(k){ if(k.indexOf('sb-')===0||k.indexOf('supabase')!==-1||k.indexOf('adulam')===0) localStorage.removeItem(k); });
  }catch(e){}
  S.session=null; S.user=null; S.profile=null;
}
function expirada(s){ return !s || !s.expires_at || (Date.now()/1000) > (s.expires_at-60); }

async function login(email, pass){
  var r = await req('/auth/v1/token?grant_type=password', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ email:email, password:pass })
  }, 15000);
  var d = await r.json();
  if(!r.ok) throw new Error(d.error_description||d.msg||d.message||'Credenciales inválidas');
  d.expires_at = Math.floor(Date.now()/1000)+(d.expires_in||3600);
  saveSession(d); S.user=d.user;
  await cargarPerfil();
  return d;
}
async function registrar(email, pass, nombre){
  var r = await req('/auth/v1/signup', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ email:email, password:pass, data:{ nombre:nombre, rol:'miembro' } })
  }, 15000);
  var d = await r.json();
  if(!r.ok) throw new Error(d.error_description||d.msg||d.message||'No se pudo registrar');
  return d;
}
async function refrescar(rt){
  try{
    var r = await req('/auth/v1/token?grant_type=refresh_token', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ refresh_token: rt })
    }, 10000);
    if(!r.ok) return null;
    var d = await r.json();
    if(!d.access_token) return null;
    d.expires_at = Math.floor(Date.now()/1000)+(d.expires_in||3600);
    saveSession(d); return d;
  }catch(e){ return null; }
}
async function cargarPerfil(){
  if(!S.user) return null;
  var fb = { id:S.user.id, nombre:(S.user.user_metadata&&S.user.user_metadata.nombre)||(S.user.email||'').split('@')[0], email:S.user.email, rol:'miembro' };
  try{
    var rows = await dbGet('profiles','id=eq.'+S.user.id+'&select=*');
    S.profile = (rows&&rows[0]) ? rows[0] : fb;
  }catch(e){ S.profile = fb; }
  return S.profile;
}
async function logout(){
  try{ await req('/auth/v1/logout',{method:'POST'},5000); }catch(e){}
  clearSession(); location.reload();
}
function rol(){ return S.profile ? S.profile.rol : 'miembro'; }
function puede(roles){ return roles.indexOf(rol())!==-1; }

function ir(id){
  var m = MENU.filter(function(x){ return x.id===id; })[0];

  vistaActual = id;

}

async function pintarMiembros(){
  var L=document.getElementById('mLista'); if(L){ L.innerHTML='<div class="text-center py-8 text-slate-400"><i data-lucide="loader-circle" class="w-6 h-6 mx-auto animate-spin"></i></div>'; ri(); }

  var secs={}; MEMB.all.forEach(function(m){ if(m.sector&&(''+m.sector).trim()) secs[(''+m.sector).trim()]=1; });
  MEMB.sectores=Object.keys(secs).sort();

}
function mMatch(m){
  var F=MEMB.filt;
  if(F.situacion.length && F.situacion.indexOf(m.situacion||'activo')===-1) return false;
  if(F.genero.length && F.genero.indexOf(m.genero||'')===-1) return false;
  if(F.edad.length){ var r=edadRango(m.fecha_nacimiento).rango; if(F.edad.indexOf(r)===-1) return false; }
  if(F.sector.length && F.sector.indexOf((m.sector||'').trim())===-1) return false;
  if(F.ministerio.length){ var ms=(m.member_teams||[]).map(function(t){return t.teams?t.teams.id:null;}); if(!F.ministerio.some(function(id){return ms.indexOf(id)!==-1;})) return false; }
  if(F.casa.length){ var hs=(m.member_houses||[]).map(function(h){return h.houses?h.houses.id:null;}); if(!F.casa.some(function(id){return hs.indexOf(id)!==-1;})) return false; }
  return true;
}
function renderMiembros(){
  var qEl=document.getElementById('mBuscar'), eEl=document.getElementById('mEstado');
  var q=(qEl?qEl.value:'').trim().toLowerCase(), est=eEl?eEl.value:'';
  var d=MEMB.all.filter(function(m){
    if(est==='__lider'){ if(!m.es_lider) return false; } else if(est){ if(m.etapa!==est) return false; }
    if(q && (m.nombre||'').toLowerCase().indexOf(q)===-1 && (m.telefono||'').toLowerCase().indexOf(q)===-1 && (m.nombre_display||'').toLowerCase().indexOf(q)===-1) return false;
    return mMatch(m);
  });
  var nf=0; Object.keys(MEMB.filt).forEach(function(k){ nf+=MEMB.filt[k].length; });
  var badge=document.getElementById('mFiltBadge'); if(badge){ if(nf>0){ badge.textContent=nf; badge.classList.remove('hidden'); badge.classList.add('flex'); } else { badge.classList.add('hidden'); badge.classList.remove('flex'); } }
  renderChipsActivos();
  var cnt=document.getElementById('mCount'); if(cnt) cnt.textContent=d.length+' de '+MEMB.all.length+' miembro'+(MEMB.all.length!==1?'s':'');
  var L=document.getElementById('mLista'); if(!L) return;
  if(!d.length){ L.innerHTML=vacio('users',(nf>0||q||est)?'Ningún miembro coincide con los filtros.':'Sin miembros registrados.'); ri(); return; }
  L.innerHTML = d.map(function(m){
    var mins=(m.member_teams||[]).map(function(t){return t.teams?t.teams.nombre:null;}).filter(Boolean);
    var cas=(m.member_houses||[]).map(function(h){return h.houses?h.houses.nombre:null;}).filter(Boolean);
    var er=edadRango(m.fecha_nacimiento);
    return '<div onclick="perfilMiembro(\''+m.id+'\')" class="bg-white rounded-2xl border border-slate-200 p-3 sm:p-4 flex items-center gap-3 hover:shadow-md transition cursor-pointer active:scale-[.99]">'+
      '<div class="w-12 h-12 rounded-full bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-white font-bold text-lg overflow-hidden flex-shrink-0">'+
        (m.foto_url?'<img src="'+esc(m.foto_url)+'" class="w-full h-full object-cover">':esc((nomShow(m)||'?')[0].toUpperCase()))+'</div>'+
      '<div class="flex-1 min-w-0">'+
        '<div class="font-semibold text-slate-800 truncate">'+esc(nomShow(m))+'</div>'+
        '<div class="text-xs text-slate-500 flex flex-wrap gap-x-3">'+
          (m.telefono?'<span>'+esc(m.telefono)+'</span>':'')+
          (er.edad!=null?'<span>'+er.edad+' años</span>':'')+
          (m.sector?'<span>'+esc(m.sector)+'</span>':'')+
          (mins.length?'<span>'+esc(mins.slice(0,2).join(', '))+'</span>':'')+

function renderChipsActivos(){
  var box=document.getElementById('mChips'); if(!box) return;
  var chips=[], labS={activo:'Activos',inactivo:'Inactivos'}, labG={M:'Hombres',F:'Mujeres'};
  function push(dim,v,label){ chips.push('<button onclick="quitarFiltro(\''+dim+'\','+MEMB.filt[dim].indexOf(v)+')" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-indigo-100 text-indigo-700 text-xs font-medium">'+esc(label)+' <i data-lucide="x" class="w-3 h-3"></i></button>'); }
  MEMB.filt.situacion.forEach(function(v){ push('situacion',v,labS[v]||v); });
  MEMB.filt.genero.forEach(function(v){ push('genero',v,labG[v]||v); });
  MEMB.filt.edad.forEach(function(v){ push('edad',v,v); });
  MEMB.filt.sector.forEach(function(v){ push('sector',v,v); });
  MEMB.filt.ministerio.forEach(function(id){ var t=(S.cache.teams||[]).filter(function(x){return x.id===id;})[0]; push('ministerio',id,t?t.nombre:'Ministerio'); });
  MEMB.filt.casa.forEach(function(id){ var h=(S.cache.houses||[]).filter(function(x){return x.id===id;})[0]; push('casa',id,h?h.nombre:'Casa'); });
  box.innerHTML=chips.join('')+(chips.length?'<button onclick="limpiarFiltrosMiembros()" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-slate-100 text-slate-500 text-xs font-medium">Limpiar todo</button>':'');

function quitarFiltro(dim,idx){ if(idx>-1) MEMB.filt[dim].splice(idx,1); renderMiembros(); }
function limpiarFiltrosMiembros(){ MEMB.filt={situacion:[],genero:[],edad:[],sector:[],ministerio:[],casa:[]}; renderMiembros(); var fb=document.getElementById('filtBody'); if(fb){ fb.innerHTML=renderFiltrosBody(); ri(); } }
function contarPorEdad(){ var c={}; (MEMB.all||[]).forEach(function(m){ var r=edadRango(m.fecha_nacimiento).rango; c[r]=(c[r]||0)+1; }); return c; }
function renderFiltrosBody(){
  var edc=contarPorEdad();
  MEMB._opts={
    situacion:[{v:'activo',label:'Activos'},{v:'inactivo',label:'Inactivos'}],
    genero:[{v:'M',label:'Hombres'},{v:'F',label:'Mujeres'}],
    edad:EDAD_RANGOS.filter(function(r){return edc[r];}).map(function(r){return {v:r,label:r,count:edc[r]};}),
    sector:MEMB.sectores.map(function(x){return {v:x,label:x};}),
    ministerio:(S.cache.teams||[]).map(function(t){return {v:t.id,label:t.nombre};}),
    casa:(S.cache.houses||[]).map(function(h){return {v:h.id,label:h.nombre};})
  };
  function grupo(tit,dim){
    var ops=MEMB._opts[dim], sel=MEMB.filt[dim]||[]; if(!ops.length) return '';
    return '<div class="mb-4"><div class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">'+tit+'</div><div class="flex flex-wrap gap-2">'+
      ops.map(function(o,i){ var on=sel.indexOf(o.v)!==-1;
        return '<button type="button" onclick="toggleFiltro(\''+dim+'\','+i+')" class="px-3 py-1.5 rounded-full text-sm border '+(on?'bg-indigo-600 text-white border-indigo-600':'bg-white text-slate-600 border-slate-300')+'">'+esc(o.label)+(o.count!=null?' <span class="'+(on?'text-indigo-200':'text-slate-400')+'">'+o.count+'</span>':'')+'</button>';
      }).join('')+'</div></div>';
  }
  return grupo('Situación','situacion')+grupo('Género','genero')+grupo('Rango de edad','edad')+grupo('Sector','sector')+grupo('Ministerio','ministerio')+grupo('Casa de Pan','casa');
}
function toggleFiltro(dim,idx){
  var o=MEMB._opts[dim][idx]; if(!o) return;
  var a=MEMB.filt[dim], i=a.indexOf(o.v); if(i===-1) a.push(o.v); else a.splice(i,1);
  var fb=document.getElementById('filtBody'); if(fb){ fb.innerHTML=renderFiltrosBody(); ri(); }
  renderMiembros();
}

      var hs=Array.prototype.slice.call(e.target.querySelectorAll('input[name=houses]:checked')).map(function(c){return c.value;});

async function cargarServiciosDia(){
  var fEl=document.getElementById('aFecha'), c=document.getElementById('aServicios');
  if(!fEl || !c) return;               // el módulo de asistencia ya no está en pantalla
  var f=fEl.value;
  if(!f){ c.innerHTML=''; return; }
  A.serviciosDia = await dbGet('service_plans','fecha=eq.'+f+'&select=*,meeting_types(nombre,icono)&order=created_at');
  var sv=A.serviciosDia;
  if(!sv.length){
    c.innerHTML='<div class="bg-amber-50 border border-amber-200 rounded-2xl p-5 text-center">'+
      '<i data-lucide="calendar-off" class="w-10 h-10 mx-auto text-amber-500 mb-2"></i>'+
      '<p class="text-amber-900 mb-3">No hay servicios planificados para esta fecha.</p>'+
      '<button onclick="ir(\'services\')" class="inline-flex items-center gap-2 px-4 py-2.5 bg-amber-600 hover:bg-amber-700 text-white rounded-xl font-semibold"><i data-lucide="plus" class="w-4 h-4"></i>Crear servicio</button></div>';
    var pn=document.getElementById('aPanel'); if(pn) pn.classList.add('hidden');
    A.servicio=null; ri(); return;
  }
  pintarSelectorServicios();
  // Autoseleccionar si corresponde, sin re-renderizar la lista (evita recursión)
  if(A.servicio){
    var vig=sv.filter(function(s){return s.id===A.servicio.id;})[0];
    if(vig) await elegirServicio(vig.id);
    else { A.servicio=null; var pn2=document.getElementById('aPanel'); if(pn2) pn2.classList.add('hidden'); }
  } else if(sv.length===1){
    await elegirServicio(sv[0].id);
  }
}

async function elegirServicio(id){
  var sv=A.serviciosDia||[];
  A.servicio = sv.filter(function(s){return s.id===id;})[0]
    || (await dbGet('service_plans','id=eq.'+id+'&select=*,meeting_types(nombre,icono)'))[0];
  if(!A.servicio){ toast('No se pudo cargar el servicio','error'); return; }
  pintarSelectorServicios();   // solo actualiza el resaltado, no vuelve a cargar
  var att=await dbGet('attendance','fecha=eq.'+A.servicio.fecha+'&meeting_type_id=eq.'+A.servicio.meeting_type_id+'&select=*');
  A.mapa={}; att.forEach(function(a){ A.mapa[a.member_id]=a; });
  var pn=document.getElementById('aPanel'); if(pn) pn.classList.remove('hidden');
  pintarAsistencia();

function filtrarMiembros(){
  var q=(document.getElementById('aBuscar').value||'').trim().toLowerCase();
  var fam=document.getElementById('aFam').value, cas=document.getElementById('aCasa').value;
  var l=A.miembros;
  if(q) l=l.filter(function(m){return (m.nombre||'').toLowerCase().indexOf(q)!==-1;});
  if(fam) l=l.filter(function(m){return m.familia_id===fam;});
  if(cas) l=l.filter(function(m){return (m.member_houses||[]).some(function(h){return h.house_id===cas;});});
  return l;
}

function pintarAsistencia(){
  if(!A.servicio) return;
  var fl=filtrarMiembros(), tot=A.miembros.length;
  var pres=0; for(var k in A.mapa){ if(A.mapa[k].asistio) pres++; }
  var mt=A.servicio.meeting_types;
  document.getElementById('aReporte').innerHTML=
    '<div class="bg-gradient-to-r from-indigo-600 to-violet-700 text-white rounded-2xl p-4 mb-3">'+
    '<div class="text-xs opacity-80 uppercase tracking-wide">Registrando asistencia</div>'+
    '<div class="text-lg font-bold">'+esc(mt?mt.icono:'⛪')+' '+esc(mt?mt.nombre:A.servicio.tipo_reunion)+'</div>'+
    (A.servicio.tema?'<div class="text-sm opacity-90 mt-1">'+esc(A.servicio.tema)+'</div>':'')+'</div>'+
    '<div class="bg-white border border-slate-200 rounded-2xl p-4 grid grid-cols-2 sm:grid-cols-4 gap-3">'+
    '<div><div class="text-xs text-slate-500">Total</div><div class="text-xl font-bold">'+tot+'</div></div>'+
    '<div><div class="text-xs text-slate-500">Presentes</div><div class="text-xl font-bold text-emerald-600">'+pres+'</div></div>'+
    '<div><div class="text-xs text-slate-500">Ausentes</div><div class="text-xl font-bold text-red-600">'+(tot-pres)+'</div></div>'+
    '<div><div class="text-xs text-slate-500">% Asist.</div><div class="text-xl font-bold text-indigo-600">'+(tot?Math.round(pres/tot*100):0)+'%</div></div></div>';
  var L=document.getElementById('aLista');
  if(!fl.length){ L.innerHTML='<p class="text-slate-400 text-center py-6">Sin miembros que coincidan.</p>'; return; }
  L.innerHTML='<div class="text-xs text-slate-500 mb-2">Mostrando '+fl.length+' de '+tot+'</div>'+
    fl.map(function(m){
      var a=A.mapa[m.id], ok=a?a.asistio:false;
      return '<label class="bg-white rounded-xl border p-3 flex items-center gap-3 cursor-pointer hover:bg-slate-50 transition '+(ok?'border-emerald-300 bg-emerald-50':'border-slate-200')+'">'+
        '<div class="w-10 h-10 rounded-full bg-indigo-500 flex items-center justify-center text-white font-bold overflow-hidden flex-shrink-0">'+
        (m.foto_url?'<img src="'+esc(m.foto_url)+'" class="w-full h-full object-cover">':esc(nomShow(m)[0].toUpperCase()))+'</div>'+
        '<div class="flex-1 min-w-0"><div class="font-medium text-slate-800 truncate">'+esc(nomShow(m))+'</div>'+
        (m.families?'<div class="text-xs text-slate-500 truncate">'+esc(m.families.nombre_familia)+'</div>':'')+'</div>'+
        '<input type="checkbox" '+(ok?'checked':'')+' onchange="marcarUno(\''+m.id+'\',this.checked)" class="w-6 h-6 accent-emerald-600 flex-shrink-0"></label>';
    }).join('');
  ri();
}

async function marcarUno(mid, ok){
  if(!A.servicio) return;
  var row={ member_id:mid, fecha:A.servicio.fecha, meeting_type_id:A.servicio.meeting_type_id, tipo_reunion:A.servicio.tipo_reunion, asistio:ok };
  try{
    await dbUpsert('attendance',[row],'member_id,fecha,tipo_reunion');
    A.mapa[mid]=row; pintarAsistencia();
  }catch(e){ toast(e.message.slice(0,120),'error'); }
}
async function marcarTodos(ok){
  if(!A.servicio) return;
  var vis=filtrarMiembros();
  if(!vis.length) return;
  if(!confirm('¿'+(ok?'Marcar':'Desmarcar')+' asistencia de '+vis.length+' miembros?')) return;
  var rows=vis.map(function(m){ return { member_id:m.id, fecha:A.servicio.fecha, meeting_type_id:A.servicio.meeting_type_id, tipo_reunion:A.servicio.tipo_reunion, asistio:ok }; });
  try{
    await dbUpsert('attendance',rows,'member_id,fecha,tipo_reunion');
    rows.forEach(function(r){ A.mapa[r.member_id]=r; });
    toast(rows.length+' actualizados','success'); pintarAsistencia();
  }catch(e){ toast(e.message.slice(0,150),'error'); }
}

/* ---------- Compartir un plan (texto + flyer) ---------- */
async function compartirPlan(id){
  try{
    var p=(await dbGet('v_plan_servicio','id=eq.'+id+'&select=*'))[0];
    var ts=await dbGet('service_tasks','service_plan_id=eq.'+id+'&select=*,members(nombre)&order=created_at');
    var f=new Date(p.fecha+'T12:00:00').toLocaleDateString('es-HN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    var roles=[]; 
    if(p.dirige) roles.push(['🎤 Dirige',p.dirige]);
    if(p.alabanza) roles.push(['🎵 Alabanza',p.alabanza]);
    if(p.ofrenda) roles.push(['💰 Ofrenda',p.ofrenda]);
    if(p.especial1||p.especial1_nombre) roles.push(['✨ '+(p.especial1||'Especial'),p.especial1_nombre||'']);
    if(p.especial2||p.especial2_nombre) roles.push(['✨ '+(p.especial2||'Especial'),p.especial2_nombre||'']);
    if(p.predica||p.predicador) roles.push(['📖 Predica',p.predica||p.predicador]);
    var anunLineas = p.anuncios_texto ? p.anuncios_texto.split(/\r?\n/).map(function(x){ return x.trim(); }).filter(Boolean) : [];

    window._compartir = { fecha:f, hora:p.hora?horaTxt(p.hora):'', tipo:(p.reunion||p.tipo_reunion), tema:p.tema,
      roles:roles, anuncios:(p.anuncios||''), anunLineas:anunLineas,
      tareas: ts.map(function(t){ return { n:t.nombre_tarea, r:(t.members?t.members.nombre:null) }; }) };

    var filas=roles.map(function(r){
      return '<div class="bg-white/10 rounded-lg px-3 py-2 flex items-center justify-between gap-2"><span class="text-sm">'+esc(r[0])+'</span><span class="text-sm font-semibold text-right">'+esc(r[1]||'—')+'</span></div>';
    }).join('');
    var filasT=ts.length?('<div class="border-t border-white/20 pt-2 mt-2 space-y-1">'+ts.map(function(t){
      return '<div class="flex items-center justify-between text-xs text-white/90"><span>'+esc(t.nombre_tarea)+'</span><span>'+esc(t.members?t.members.nombre:'—')+'</span></div>';
    }).join('')+'</div>'):'';
    var anunBloque = anunLineas.length ? ('<div class="bg-white/15 rounded-xl p-3 mt-3"><div class="text-xs uppercase tracking-widest opacity-80 mb-1.5">📢 Anuncios'+(p.anuncios?' · '+esc(p.anuncios):'')+'</div><div class="space-y-1">'+anunLineas.map(function(l){ return '<div class="text-sm leading-snug flex items-start gap-1.5"><span class="opacity-70">•</span><span>'+esc(l)+'</span></div>'; }).join('')+'</div></div>') : '';

    modal('mC','<div id="flyer" class="flyer text-white p-6 sm:p-8">'+
      '<div class="text-center mb-4"><div class="text-5xl sm:text-6xl font-black tracking-wider mb-1" style="letter-spacing:.1em">ADULAM</div>'+
      '<div class="text-4xl mb-2">'+esc(p.reunion_icono||'⛪')+'</div>'+
      '<h2 class="text-2xl sm:text-3xl font-bold leading-tight">'+esc(p.reunion||p.tipo_reunion)+'</h2>'+
      '<p class="text-base mt-1 capitalize">'+esc(f)+(p.hora?' · '+horaTxt(p.hora):'')+'</p></div>'+
      (p.tema?'<div class="bg-white/15 rounded-xl p-3 text-center mb-4"><div class="text-xs uppercase opacity-80">Tema</div><div class="text-lg font-semibold">'+esc(p.tema)+'</div></div>':'')+
      '<div class="space-y-1.5">'+filas+filasT+'</div>'+anunBloque+
      '<div class="text-center mt-5 text-xs opacity-70">Compartido desde ADULAM</div></div>'+
      '<div class="p-4 flex flex-col sm:flex-row gap-2 bg-slate-100 np">'+
      '<button onclick="descargarFlyer()" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold flex items-center justify-center gap-2"><i data-lucide="download" class="w-4 h-4"></i>Descargar imagen</button>'+
      '<button onclick="copiarTextoPlan()" class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-semibold flex items-center justify-center gap-2"><i data-lucide="clipboard" class="w-4 h-4"></i>Copiar texto</button>'+
      '<button onclick="closeModal(\'mC\')" class="py-3 px-6 bg-slate-300 rounded-xl">Cerrar</button></div>');
  }catch(e){ toast(e.message.slice(0,120),'error'); }
}
function copiarTextoPlan(){
  var d=window._compartir; if(!d) return;
  var t='*IGLESIA ADULAM*\n\n📅 '+d.fecha+(d.hora?'\n🕐 '+d.hora:'')+'\n'+d.tipo+'\n';
  if(d.tema) t+='\n📖 Tema: *'+d.tema+'*\n';
  t+='\n*Organización del servicio:*\n';
  d.roles.forEach(function(r){ t+=r[0]+': '+(r[1]||'sin asignar')+'\n'; });
  if(d.tareas.length){ t+='\n*Otras tareas:*\n'; d.tareas.forEach(function(x){ t+='• '+x.n+': '+(x.r||'sin asignar')+'\n'; }); }
  if(d.anunLineas && d.anunLineas.length){ t+='\n*📢 Anuncios:*'+(d.anuncios?' ('+d.anuncios+')':'')+'\n'; d.anunLineas.forEach(function(l){ t+='• '+l+'\n'; }); }
  t+='\n_Bendiciones. ¡Te esperamos!_';
  copiar(t);
}
function copiar(t){
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(function(){ toast('Texto copiado','success'); }).catch(function(){ prompt('Copia manualmente:',t); });
  else prompt('Copia manualmente:',t);
}
async function descargarFlyer(){
  toast('Generando imagen...','info');
  try{
    if(!window.html2canvas){
      await new Promise(function(res,rej){ var s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
    }
    var el=document.getElementById('flyer');
    var cv=await html2canvas(el,{scale:2,backgroundColor:null,useCORS:true});
    cv.toBlob(function(b){ var u=URL.createObjectURL(b); var a=document.createElement('a'); a.href=u; a.download='servicio-adulam-'+hoy()+'.png'; a.click(); URL.revokeObjectURL(u); toast('Imagen descargada','success'); });
  }catch(e){ toast('No se pudo generar: '+e.message.slice(0,80),'error'); }
}

function copiarSemana(){
  var d=window._semana; if(!d) return;
  var dias=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  var t='*IGLESIA ADULAM*\n*Servicios de la semana*\n'+d.rango+'\n';
  d.planes.forEach(function(p){
    var dd=new Date(p.fecha+'T12:00:00');
    t+='\n'+esc(p.reunion_icono||'⛪')+' *'+(p.reunion||p.tipo_reunion)+'*\n'+dias[dd.getDay()]+' '+dd.getDate()+(p.hora?' · '+horaTxt(p.hora):'')+'\n';

  });
  t+='\n_¡Bendiciones para todo el equipo!_';
  copiar(t);
}

/* Paleta coherente con la app */
var GC={ indigo:'#6366f1', violet:'#8b5cf6', emerald:'#10b981', amber:'#f59e0b',

/* ---------- helpers de gráfico SVG ---------- */
function niceMax(v){ if(v<=0) return 10; var p=Math.pow(10,Math.floor(Math.log10(v))); var n=v/p; var m=n<=1?1:n<=2?2:n<=5?5:10; return m*p; }

/* Gráfico de línea/área con puntos */
function lineChart(labels, series, opts){
  opts=opts||{};
  var W=opts.w||400, H=opts.h||210, pl=40, pr=14, pt=14, pb=34;
  var iw=W-pl-pr, ih=H-pt-pb;
  var allv=[]; series.forEach(function(s){ allv=allv.concat(s.data); });
  var max=niceMax(Math.max.apply(null, allv.concat([1])));
  var n=labels.length;
  var xat=function(i){ return pl + (n<=1?iw/2:iw*i/(n-1)); };
  var yat=function(v){ return pt + ih - ih*(v/max); };
  var g='<svg viewBox="0 0 '+W+' '+H+'" class="w-full" style="height:auto" preserveAspectRatio="xMidYMid meet">';
  /* grid + eje Y */
  for(var k=0;k<=4;k++){ var gy=pt+ih*k/4; var gv=Math.round(max*(4-k)/4);
    g+='<line x1="'+pl+'" y1="'+gy+'" x2="'+(W-pr)+'" y2="'+gy+'" stroke="#f1f5f9" stroke-width="1"/>';
    g+='<text x="'+(pl-6)+'" y="'+(gy+4)+'" text-anchor="end" font-size="13" fill="#94a3b8">'+gv+'</text>';
  }
  series.forEach(function(s){
    var col=s.color||GC.indigo;
    var pts=s.data.map(function(v,i){ return xat(i)+','+yat(v); });
    if(opts.area!==false){
      var area='M'+xat(0)+','+(pt+ih)+' L'+pts.join(' L')+' L'+xat(n-1)+','+(pt+ih)+' Z';
      g+='<path d="'+area+'" fill="'+col+'" opacity="0.08"/>';
    }
    g+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    s.data.forEach(function(v,i){ g+='<circle cx="'+xat(i)+'" cy="'+yat(v)+'" r="3" fill="#fff" stroke="'+col+'" stroke-width="2"/>'; });
  });
  /* eje X */
  labels.forEach(function(l,i){
    if(n>8 && i%2!==0 && i!==n-1) return;
    g+='<text x="'+xat(i)+'" y="'+(H-10)+'" text-anchor="middle" font-size="13" fill="#64748b">'+esc(l)+'</text>';
  });
  if(opts.showValues){ series.forEach(function(s){ s.data.forEach(function(v,i){ var ly=Math.max(yat(v)-8, pt+9); g+='<text x="'+xat(i)+'" y="'+ly+'" text-anchor="middle" font-size="12" font-weight="700" fill="'+(s.color||GC.indigo)+'">'+v+'</text>'; }); }); }
  return g+'</svg>';
}

/* Barras verticales agrupadas (ingresos/egresos) */
function barChart(labels, series, opts){
  opts=opts||{};
  var W=opts.w||400, H=opts.h||210, pl=48, pr=14, pt=14, pb=34;
  var iw=W-pl-pr, ih=H-pt-pb, n=labels.length;
  var allv=[]; series.forEach(function(s){ allv=allv.concat(s.data); });
  var max=niceMax(Math.max.apply(null, allv.concat([1])));
  var yat=function(v){ return pt+ih-ih*(v/max); };
  var group=iw/n, ns=series.length, bw=Math.min(group*0.7/ns, 22), gap=(group-bw*ns)/2;
  var g='<svg viewBox="0 0 '+W+' '+H+'" class="w-full" style="height:auto" preserveAspectRatio="xMidYMid meet">';
  for(var k=0;k<=4;k++){ var gy=pt+ih*k/4; var gv=max*(4-k)/4;
    g+='<line x1="'+pl+'" y1="'+gy+'" x2="'+(W-pr)+'" y2="'+gy+'" stroke="#f1f5f9" stroke-width="1"/>';
    g+='<text x="'+(pl-6)+'" y="'+(gy+4)+'" text-anchor="end" font-size="12" fill="#94a3b8">'+(gv>=1000?(gv/1000).toFixed(gv%1000?1:0)+'k':Math.round(gv))+'</text>';
  }
  labels.forEach(function(l,i){
    var x0=pl+group*i+gap;
    series.forEach(function(s,si){
      var v=s.data[i]||0, x=x0+bw*si, y=yat(v), h=pt+ih-y;
      g+='<rect x="'+x+'" y="'+y+'" width="'+(bw-2)+'" height="'+Math.max(h,0)+'" rx="2" fill="'+(s.color||GC.indigo)+'"/>';
    });
    if(!(n>8 && i%2!==0 && i!==n-1)) g+='<text x="'+(pl+group*i+group/2)+'" y="'+(H-10)+'" text-anchor="middle" font-size="13" fill="#64748b">'+esc(l)+'</text>';
  });
  return g+'</svg>';
}

/* Dona */
function donutChart(items, opts){
  opts=opts||{}; var size=opts.size||150, r=size/2, ir=r*0.62, cx=r, cy=r;
  var total=items.reduce(function(a,b){ return a+b.value; },0);
  if(total<=0) return '';
  var ang=-Math.PI/2, g='<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">';
  items.forEach(function(it){
    var frac=it.value/total, a2=ang+frac*Math.PI*2;
    var large=frac>0.5?1:0;
    var x1=cx+r*Math.cos(ang), y1=cy+r*Math.sin(ang), x2=cx+r*Math.cos(a2), y2=cy+r*Math.sin(a2);
    var xi2=cx+ir*Math.cos(a2), yi2=cy+ir*Math.sin(a2), xi1=cx+ir*Math.cos(ang), yi1=cy+ir*Math.sin(ang);
    g+='<path d="M'+x1+','+y1+' A'+r+','+r+' 0 '+large+' 1 '+x2+','+y2+' L'+xi2+','+yi2+' A'+ir+','+ir+' 0 '+large+' 0 '+xi1+','+yi1+' Z" fill="'+it.color+'"/>';
    ang=a2;
  });
  g+='<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" font-size="'+(size*0.2)+'" font-weight="700" fill="#334155">'+total+'</text>';
  g+='<text x="'+cx+'" y="'+(cy+size*0.13)+'" text-anchor="middle" font-size="'+(size*0.08)+'" fill="#94a3b8">'+esc(opts.label||'total')+'</text>';
  return g+'</svg>';
}

      L.marker([la,ln],{ icon:casaIcon }).addTo(map).bindPopup('<b>\ud83c\udf3e '+esc(c.nombre)+'</b>'+(c.direccion?'<br><span style="color:#64748b">'+esc(c.direccion)+'</span>':'')+'<br><span style="color:#2563eb;font-weight:600">Radio: '+rkm+' km</span>');
      try{ var cb=circ.getBounds(); pts.push([cb.getNorth(),cb.getEast()],[cb.getSouth(),cb.getWest()]); }catch(e){ pts.push([la,ln]); }
    });
    if(pts.length){ try{ map.fitBounds(pts,{ padding:[30,30], maxZoom:16 }); }catch(e){} }
    if(mem.length||casas.length){
      var leyenda=L.control({position:'bottomleft'});
      leyenda.onAdd=function(){ var div=L.DomUtil.create('div'); div.style.cssText='background:#fff;padding:6px 10px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.2);font:12px sans-serif;line-height:1.5'; div.innerHTML='<div style="display:flex;align-items:center;gap:6px;margin-bottom:2px"><span style="width:12px;height:12px;background:#eab308;border-radius:50%;display:inline-block"></span>Miembros</div><div style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:12px;background:#2563eb;border-radius:50%;display:inline-block"></span>Casas de Pan</div>'; return div; };
      leyenda.addTo(map);
    }
    setTimeout(function(){ try{ map.invalidateSize(); }catch(e){} }, 220);
  }catch(e){ errorPagina(e); }
}

      '<button onclick="formIngresoPastoral()" class="px-5 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl flex items-center gap-2"><i data-lucide="plus" class="w-5 h-5"></i>Nuevo ingreso</button>'+
      '<div class="text-[11px] text-slate-400 flex items-center gap-1 text-right leading-tight"><i data-lucide="lock" class="w-3.5 h-3.5 flex-shrink-0"></i>Privado ·<br>aparte de tesorería</div></div>'+
    '<div id="ipResumen" class="mb-2"></div>'+

}

      return '<div class="bg-white rounded-2xl border border-slate-200 p-3">'+
        '<div class="flex items-center gap-2 mb-1.5"><div class="w-8 h-8 rounded-lg bg-'+t[2]+'-100 text-'+t[2]+'-700 flex items-center justify-center flex-shrink-0"><i data-lucide="'+t[1]+'" class="w-4 h-4"></i></div>'+
        '<span class="text-xs text-slate-500 leading-tight">'+esc(t[0])+'</span></div>'+
        '<div class="text-base font-bold text-slate-800 leading-tight">'+dinero(c.total_mes)+'</div>'+
        '<div class="text-[11px] text-slate-400">año '+dinero(c.total_anio)+'</div></div>';
    }).join('');
    document.getElementById('ipResumen').innerHTML=
      '<div class="bg-gradient-to-br from-indigo-600 to-violet-700 text-white rounded-2xl p-5 mb-3">'+
        '<div class="text-xs uppercase tracking-wide opacity-80">Ingreso pastoral · '+esc(mesNombre)+'</div>'+
        '<div class="text-3xl font-bold mt-1">'+dinero(totMes)+'</div>'+
        '<div class="text-sm opacity-80 mt-0.5">Acumulado del año: '+dinero(totAnio)+'</div></div>'+
      '<div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">'+chips+'</div>';
    var lc=document.getElementById('ipList');
    if(!d.length){ lc.innerHTML='<div class="mt-5">'+vacio('hand-coins','Aún no hay ingresos registrados. Toca \u201cNuevo ingreso\u201d para empezar.')+'</div>'; ri(); return; }
    var borrable=puede(['admin','pastor']);
    lc.innerHTML='<h4 class="text-sm font-semibold text-slate-500 mt-5 mb-2">Movimientos recientes</h4>'+d.map(function(x){ var t=IP_TIPOS[x.tipo]||IP_TIPOS.otro;
      var quien=x.members?x.members.nombre:(x.nombre_externo||'');
      return '<div class="bg-white border border-slate-200 rounded-xl p-3 flex items-center gap-3">'+
        '<div class="w-10 h-10 rounded-xl bg-'+t[2]+'-100 text-'+t[2]+'-700 flex items-center justify-center flex-shrink-0"><i data-lucide="'+t[1]+'" class="w-5 h-5"></i></div>'+
        '<div class="flex-1 min-w-0"><div class="font-semibold text-slate-800">'+dinero(x.monto)+' <span class="text-xs font-normal text-slate-400">'+esc(t[0])+'</span></div>'+
        '<div class="text-xs text-slate-500 truncate">'+fecha(x.fecha)+(quien?' · '+esc(quien):'')+(x.detalle?' · '+esc(x.detalle):'')+'</div></div>'+
        '<div class="flex gap-1 flex-shrink-0"><button onclick="formIngresoPastoral(\''+x.id+'\')" class="p-1.5 hover:bg-slate-100 rounded-lg text-slate-400"><i data-lucide="pencil" class="w-4 h-4"></i></button>'+
        (borrable?'<button onclick="borrarIngresoPastoral(\''+x.id+'\')" class="p-1.5 text-red-600 hover:bg-red-100 rounded-lg"><i data-lucide="trash-2" class="w-4 h-4"></i></button>':'')+'</div></div>';

async function formIngresoPastoral(id){
  var mem=(S.cache.members&&S.cache.members.length)?S.cache.members:await dbGet('members','select=id,nombre,nombre_display&order=nombre');
  var d={};
  if(id){ d=(await dbGet('ingresos_pastorales','id=eq.'+id+'&select=*'))[0]||{}; }
  var opTipo=Object.keys(IP_TIPOS).map(function(k){return '<option value="'+k+'"'+((d.tipo||'diezmo')===k?' selected':'')+'>'+IP_TIPOS[k][0]+'</option>';}).join('');
  var opMem='<option value="">— No es miembro / externo —</option>'+mem.map(function(m){return '<option value="'+m.id+'"'+(d.member_id===m.id?' selected':'')+'>'+esc(nomShow(m))+'</option>';}).join('');
  modal('mIP', mHead((id?'Editar':'Nuevo')+' ingreso pastoral','mIP')+
    '<form id="fIP" class="p-4 space-y-3">'+
    '<div class="grid grid-cols-2 gap-3">'+
      '<div><label class="text-sm font-medium">Tipo *</label><select name="tipo" required class="w-full mt-1 px-3 py-2.5 border border-slate-300 rounded-lg bg-white">'+opTipo+'</select></div>'+
      '<div><label class="text-sm font-medium">Monto (L) *</label><input name="monto" type="number" step="0.01" min="0" required value="'+(d.monto!=null?d.monto:'')+'" class="w-full mt-1 px-3 py-2.5 border border-slate-300 rounded-lg"></div>'+
    '</div>'+
    '<div><label class="text-sm font-medium">Fecha *</label><input name="fecha" type="date" required value="'+(d.fecha||hoy())+'" class="w-full mt-1 px-3 py-2.5 border border-slate-300 rounded-lg"></div>'+
    '<div><label class="text-sm font-medium">Miembro (opcional)</label><select name="member_id" class="w-full mt-1 px-3 py-2.5 border border-slate-300 rounded-lg bg-white">'+opMem+'</select></div>'+
    '<div><label class="text-sm font-medium">Nombre (si no es miembro)</label><input name="nombre_externo" value="'+esc(d.nombre_externo||'')+'" class="w-full mt-1 px-3 py-2.5 border border-slate-300 rounded-lg"></div>'+
    '<div><label class="text-sm font-medium">Detalle</label><input name="detalle" value="'+esc(d.detalle||'')+'" placeholder="Nota opcional" class="w-full mt-1 px-3 py-2.5 border border-slate-300 rounded-lg"></div>'+
    mFoot('mIP',id?'Guardar':'Registrar')+'</form>');
  document.getElementById('fIP').onsubmit=async function(e){
    e.preventDefault();
    var btn=e.target.querySelector('button[type=submit]'); btn.disabled=true;
    try{
      var fd=new FormData(e.target);
      var b={ tipo:fd.get('tipo'), monto:parseFloat(fd.get('monto'))||0, fecha:fd.get('fecha'),
        member_id:fd.get('member_id')||null, nombre_externo:(fd.get('nombre_externo')||'').trim()||null,
        detalle:(fd.get('detalle')||'').trim()||null };
      if(id) await dbPatch('ingresos_pastorales','id=eq.'+id,b); else await dbPost('ingresos_pastorales',b);
      toast('Ingreso guardado','success'); closeModal('mIP'); pintarPastoral();
    }catch(err){ toast(err.message.slice(0,140),'error'); btn.disabled=false; }
  };
}
async function borrarIngresoPastoral(id){
  if(!confirm('¿Eliminar este ingreso?')) return;
  try{ await dbDel('ingresos_pastorales','id=eq.'+id); toast('Eliminado','success'); pintarPastoral(); }
  catch(e){ toast(e.message.slice(0,140),'error'); }
}

function render_stats(mem, etapas, crec, asis, vis, casas, finMes, finCat, dec, decMes, ingPast, riesgo){
  var p=document.getElementById('page');
  var h='';

  /* --- Encabezado con fecha --- */
  h+='<div class="mb-5"><h3 class="text-xl sm:text-2xl font-bold text-slate-800">Estadísticas</h3>'+
     '<p class="text-sm text-slate-500 mt-0.5">Salud y crecimiento de la iglesia · '+new Date().toLocaleDateString('es-HN',{day:'numeric',month:'long',year:'numeric'})+'</p></div>';

  /* --- KPIs principales --- */
  var totalVis=vis.total||0, conv=vis.tasa_conversion;
  h+='<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">'+
     kpi('users','Miembros activos',mem.activos||0,(mem.nuevos_30d?{cls:'text-emerald-600',ic:'trending-up',txt:'+'+mem.nuevos_30d+' este mes'}:null),'indigo')+
     kpi('star','Líderes',mem.lideres||0,{cls:'text-slate-400',txt:(mem.activos?Math.round((mem.lideres||0)/mem.activos*100):0)+'% del cuerpo'},'amber')+
     kpi('user-plus','Visitas (90d)',vis.visitas_90d||0,(conv!=null?{cls:'text-emerald-600',txt:conv+'% se integran'}:null),'sky')+
     kpi('book-open','En discipulado',mem.en_discipulado||0,null,'violet')+
     '</div>';

  h+='<div class="grid lg:grid-cols-2 gap-4 mb-4">';

  /* --- Crecimiento de miembros --- */
  var totCrec=crec.reduce(function(a,b){ return a+Number(b.nuevos_mes); },0);
  var cuerpoCrec = totCrec<=1
    ? chartEmpty('trending-up','Aquí verás cómo crece tu congregación mes a mes. La línea cobrará forma conforme se registren miembros a lo largo del tiempo.')
    : lineChart(crec.map(function(x){return x.etiqueta;}), [{data:crec.map(function(x){return Number(x.acumulado);}),color:GC.indigo}], {showValues:true})+
      '<p class="text-xs text-slate-400 text-center mt-2">Miembros acumulados · últimos 12 meses</p>';
  h+=card('Crecimiento de la membresía','trending-up',cuerpoCrec);

  /* --- Etapas espirituales (embudo) --- */
  var ETQ={visita:['Visita',GC.sky],nuevo:['Nuevo',GC.indigo],discipulado:['Discipulado',GC.violet],bautizado:['Bautizado',GC.emerald],miembro:['Miembro pleno','#4f46e5']};
  if(etapas.length){
    var maxE=Math.max.apply(null, etapas.map(function(e){return Number(e.total);}).concat([1]));
    var barras=etapas.map(function(e){
      var t=ETQ[e.etapa]||[e.etapa,GC.slate], w=Math.round(Number(e.total)/maxE*100);
      return '<div class="mb-2.5"><div class="flex items-center justify-between text-xs mb-1"><span class="font-medium text-slate-700">'+t[0]+'</span><span class="text-slate-500 font-semibold">'+e.total+'</span></div>'+
        '<div class="h-2.5 bg-slate-100 rounded-full overflow-hidden"><div class="h-full rounded-full transition-all" style="width:'+w+'%;background:'+t[1]+'"></div></div></div>';
    }).join('');
    h+=card('Camino espiritual','route','<div class="pt-1">'+barras+'</div><p class="text-xs text-slate-400 text-center mt-3">De la visita a la plena comunión</p>');
  } else {
    h+=card('Camino espiritual','route',chartEmpty('route','Muestra cuántos miembros hay en cada etapa: visita, nuevo, discipulado, bautizado y miembro pleno.'));
  }
  h+='</div>';

  /* --- Asistencia semanal --- */
  var hayAsis=asis.some(function(x){ return Number(x.promedio)>0; });
  var cuerpoAsis = !hayAsis
    ? chartEmpty('clipboard-check','Registra asistencia unas semanas y aquí aparecerá la tendencia: si tu congregación crece, se mantiene o necesita atención.')
    : lineChart(asis.map(function(x){return x.etiqueta;}), [{data:asis.map(function(x){return Number(x.promedio);}),color:GC.emerald}], {showValues:true})+
      '<p class="text-xs text-slate-400 text-center mt-2">Promedio de asistentes por semana · últimas 12 semanas</p>';
  h+='<div class="mb-4">'+card('Tendencia de asistencia','line-chart',cuerpoAsis)+'</div>';

  /* --- Embudo de visitas + composición --- */
  h+='<div class="grid lg:grid-cols-2 gap-4 mb-4">';
  if(totalVis>0){
    var pasos=[['Llegaron',totalVis,GC.sky],['En seguimiento',(vis.en_seguimiento||0)+(vis.integradas||0),GC.amber],['Se integraron',vis.integradas||0,GC.emerald]];
    var funil=pasos.map(function(s,i){
      var w=Math.round(s[1]/totalVis*100);
      return '<div class="mb-2.5"><div class="flex items-center justify-between text-xs mb-1"><span class="font-medium text-slate-700">'+s[0]+'</span><span class="text-slate-500 font-semibold">'+s[1]+'</span></div>'+
        '<div class="h-6 bg-slate-100 rounded-lg overflow-hidden"><div class="h-full rounded-lg flex items-center justify-end pr-2 transition-all" style="width:'+Math.max(w,8)+'%;background:'+s[2]+'"><span class="text-[10px] text-white font-bold">'+w+'%</span></div></div></div>';
    }).join('');
    h+=card('Embudo de visitas','filter','<div class="pt-1">'+funil+'</div>'+(conv!=null?'<div class="mt-3 text-center bg-emerald-50 rounded-xl py-2"><span class="text-sm text-emerald-700">Tasa de conversión: <strong>'+conv+'%</strong></span></div>':''));
  } else {
    h+=card('Embudo de visitas','filter',chartEmpty('user-plus','Cuando registres visitas verás cuántas pasan de la primera vez a integrarse como miembros — y tu tasa de conversión.'));
  }

  /* Composición por género */
  var hom=mem.hombres||0, muj=mem.mujeres||0;
  if(hom+muj>0){
    var dona=donutChart([{value:hom,color:GC.indigo},{value:muj,color:GC.rose}],{label:'activos'});
    h+=card('Composición','users','<div class="flex items-center justify-center gap-5"><div>'+dona+'</div></div>'+
      legend([{label:'Hombres',color:GC.indigo,value:hom},{label:'Mujeres',color:GC.rose,value:muj}]));
  } else {
    h+=card('Composición','users',chartEmpty('users','Registra el género de los miembros para ver la composición de la congregación. Puedes hacerlo al editar cada ficha.'));
  }
  h+='</div>';

  /* --- Finanzas (solo auditores) --- */
  if(finAuditor() && finMes){
    var hayFin=finMes.some(function(x){ return Number(x.ingresos)>0||Number(x.egresos)>0; });
    if(hayFin){
      var filasMes=finMes.filter(function(x){return Number(x.ingresos)||Number(x.egresos);}).map(function(x){ var neto=Number(x.neto);
        return '<div class="flex items-center justify-between text-xs py-1.5 border-b border-slate-50 last:border-0"><span class="w-12 text-slate-600 font-medium">'+esc(x.etiqueta)+'</span><span class="flex-1 text-right text-emerald-600">'+dinero(x.ingresos)+'</span><span class="flex-1 text-right text-red-500">'+dinero(x.egresos)+'</span><span class="flex-1 text-right font-semibold '+(neto>=0?'text-slate-800':'text-red-600')+'">'+dinero(neto)+'</span></div>'; }).join('');
      var desgloseMes='<div class="mt-3 pt-2 border-t border-slate-100"><div class="flex items-center justify-between text-[10px] uppercase tracking-wide text-slate-400 mb-1 font-semibold"><span class="w-12">Mes</span><span class="flex-1 text-right">Ingresos</span><span class="flex-1 text-right">Egresos</span><span class="flex-1 text-right">Balance</span></div>'+filasMes+'</div>';
      h+='<div class="mb-4">'+card('Ingresos y egresos','bar-chart-3',
        barChart(finMes.map(function(x){return x.etiqueta;}),
          [{data:finMes.map(function(x){return Number(x.ingresos);}),color:GC.emerald},
           {data:finMes.map(function(x){return Number(x.egresos);}),color:GC.red}])+
        legend([{label:'Ingresos',color:GC.emerald},{label:'Egresos',color:GC.red}])+desgloseMes,
        '<span class="text-xs text-slate-400">últimos 12 meses</span>')+'</div>';

      var ingCat=finCat.filter(function(c){ return c.tipo==='ingreso'; });
      if(ingCat.length){
        var cols=[GC.emerald,GC.indigo,GC.violet,GC.amber,GC.sky,GC.rose,GC.slate];
        var items=ingCat.slice(0,7).map(function(c,i){ return {label:c.categoria,value:Math.round(c.total),color:cols[i%cols.length]}; });
        h+='<div class="mb-4">'+card('Ingresos por categoría · este mes','pie-chart',
          '<div class="flex flex-col sm:flex-row items-center gap-4"><div>'+donutChart(items.map(function(x){return {value:x.value,color:x.color};}),{label:'L'})+'</div>'+
          '<div class="flex-1 w-full space-y-1.5">'+items.map(function(x){
            return '<div class="flex items-center gap-2 text-sm"><span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background:'+x.color+'"></span>'+
              '<span class="text-slate-700 flex-1 truncate capitalize">'+esc(x.label)+'</span><span class="font-semibold text-slate-800">'+dinero(x.value)+'</span></div>';
          }).join('')+'</div></div>')+'</div>';
      }
    } else {
      h+='<div class="mb-4">'+card('Finanzas','bar-chart-3',chartEmpty('wallet','Cuando registres ingresos y egresos verás aquí la comparación mensual y de qué provienen las ofrendas.'))+'</div>';
    }
  }

  /* --- Comparativo mensual (ingresos/egresos/neto) --- */
  if(finAuditor() && finMes && finMes.length>=2){
    var cmA=finMes[finMes.length-1], cmP=finMes[finMes.length-2];
    var delta=function(a,p){ a=Number(a)||0; p=Number(p)||0;
      if(p===0) return a>0?'<span class="text-emerald-600 font-medium">nuevo</span>':'<span class="text-slate-400">\u2014</span>';
      var pct=Math.round((a-p)/Math.abs(p)*100), up=a>=p;
      return '<span class="'+(up?'text-emerald-600':'text-red-500')+' font-medium">'+(up?'\u25b2':'\u25bc')+' '+Math.abs(pct)+'%</span>'; };
    var filaC=function(lab,a,p,col){
      return '<div class="flex items-center justify-between py-2 border-b border-slate-50 last:border-0">'+
        '<span class="text-sm text-slate-600">'+lab+'</span>'+
        '<div class="text-right"><div class="text-sm font-semibold '+col+'">'+dinero(a)+'</div>'+
        '<div class="text-[11px] text-slate-400">mes previo '+dinero(p)+' \u00b7 '+delta(a,p)+'</div></div></div>'; };
    var netoA=Number(cmA.neto), netoP=Number(cmP.neto);
    h+='<div class="mb-4">'+card('Comparativo del mes \u00b7 '+esc(cmA.etiqueta),'arrow-left-right',
      filaC('Ingresos',cmA.ingresos,cmP.ingresos,'text-emerald-700')+
      filaC('Egresos',cmA.egresos,cmP.egresos,'text-red-600')+
      filaC('Neto',netoA,netoP,netoA>=0?'text-slate-800':'text-red-600'),
      '<span class="text-xs text-slate-400">vs. '+esc(cmP.etiqueta)+'</span>')+'</div>';
  }

  /* --- Miembros en riesgo por inasistencia --- */
  if(puede(['admin','pastor','lider','servidor'])){
    if(riesgo && riesgo.length){
      var tier=function(f){ return f>15?['red','#dc2626']:(f>6?['orange','#ea580c']:['yellow','#ca8a04']); };
      var listaR=riesgo.slice(0,20).map(function(r){
        var f=Number(r.faltas)||3, t=tier(f);
        return '<div class="flex items-center gap-3 p-2.5 rounded-xl border bg-'+t[0]+'-50 border-'+t[0]+'-200 mb-1.5">'+
          '<div class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0" style="background:'+t[1]+'22;color:'+t[1]+'"><i data-lucide="user-minus" class="w-4 h-4"></i></div>'+
          '<div class="flex-1 min-w-0"><div class="text-sm font-medium text-slate-800 truncate">'+esc(r.nombre)+'</div>'+
          '<div class="text-xs text-slate-500">Falt\u00f3 a '+f+' servicio'+(f!==1?'s':'')+' seguidos \u00b7 \u00falt. asist. '+fecha(r.ultima)+'</div></div>'+
          (r.telefono?'<a href="'+waLink(r.telefono,'\u00a1Hola '+r.nombre.split(' ')[0]+'! Te extra\u00f1amos en la iglesia. \u00bfC\u00f3mo est\u00e1s? Queremos saber de ti. \ud83d\ude4f')+'" target="_blank" class="p-2 text-emerald-600 hover:bg-emerald-50 rounded-lg flex-shrink-0"><i data-lucide="message-circle" class="w-5 h-5"></i></a>':'')+'</div>';
      }).join('');
      h+='<div class="mb-4">'+card('Miembros en riesgo','user-minus',
        '<p class="text-xs text-slate-500 mb-1">'+riesgo.length+' miembro'+(riesgo.length!==1?'s':'')+' sin asistir a los \u00faltimos 3 servicios seguidos.</p>'+
        '<div class="flex flex-wrap gap-x-3 gap-y-1 mb-2 text-[11px] text-slate-500"><span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full" style="background:#ca8a04"></span>3+</span><span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full" style="background:#ea580c"></span>6+</span><span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full" style="background:#dc2626"></span>15+ servicios</span></div>'+
        '<div>'+listaR+'</div>'+(riesgo.length>20?'<p class="text-xs text-slate-400 mt-2 text-center">y '+(riesgo.length-20)+' m\u00e1s</p>':''))+'</div>';
    } else {
      h+='<div class="mb-4">'+card('Miembros en riesgo','user-check',chartEmpty('user-check','Aqu\u00ed aparecer\u00e1n los miembros que faltaron a los 3 servicios m\u00e1s recientes seguidos, con un bot\u00f3n para contactarlos. Se activa a medida que registras asistencia.'))+'</div>';
    }
  }

  /* --- Decisiones espirituales --- */
  var totDecAnio=(dec||[]).reduce(function(a,b){ return a+Number(b.total_anio); },0);
  if(totDecAnio>0){
    var maxDe=Math.max.apply(null,(dec||[]).map(function(x){return Number(x.total_anio);}).concat([1]));
    var dcol={acepto:GC.emerald,reconcilio:GC.amber,bautismo_agua:GC.sky,bautismo_espiritu:GC.violet,dedicacion:GC.indigo,otro:GC.slate};
    var barrasDe=(dec||[]).filter(function(x){return Number(x.total_anio)>0||Number(x.total_hist)>0;}).map(function(e){
      var w=Math.round(Number(e.total_anio)/maxDe*100);
      return '<div class="mb-2.5"><div class="flex items-center justify-between text-xs mb-1"><span class="font-medium text-slate-700">'+esc(e.etiqueta)+'</span><span class="text-slate-500 font-semibold">'+e.total_anio+'<span class="text-slate-400 font-normal"> \u00b7 '+e.total_hist+' hist.</span></span></div>'+
        '<div class="h-2.5 bg-slate-100 rounded-full overflow-hidden"><div class="h-full rounded-full" style="width:'+w+'%;background:'+(dcol[e.tipo]||GC.slate)+'"></div></div></div>';
    }).join('');
    var hayTr=(decMes||[]).some(function(x){return Number(x.total)>0;});
    var trend=hayTr?lineChart(decMes.map(function(x){return x.etiqueta;}),[{data:decMes.map(function(x){return Number(x.total);}),color:GC.emerald}])+'<p class="text-xs text-slate-400 text-center mt-2">Decisiones por mes \u00b7 \u00faltimos 12 meses</p>':'';
    h+='<div class="mb-4">'+card('Decisiones espirituales \u00b7 '+new Date().getFullYear(),'sprout','<div class="pt-1">'+barrasDe+'</div>'+trend)+'</div>';
  } else {
    h+='<div class="mb-4">'+card('Decisiones espirituales','sprout',chartEmpty('sprout','Registra aceptos, reconciliaciones y bautismos en el m\u00f3dulo Decisiones para ver aqu\u00ed el fruto del ministerio a lo largo del a\u00f1o.'))+'</div>';
  }

  /* --- Casas de Pan --- */
  if(casas.length){
    var maxInt=Math.max.apply(null, casas.map(function(c){return Number(c.integrantes);}).concat([1]));
    h+='<div class="mb-4">'+card('Salud de las Casas de Pan','wheat',
      '<div class="space-y-3">'+casas.map(function(c){
        var w=Math.round(Number(c.integrantes)/maxInt*100);
        var alerta=Number(c.integrantes)===0;
        return '<div class="flex items-center gap-3"><div class="w-9 h-9 rounded-xl bg-amber-100 text-amber-700 flex items-center justify-center flex-shrink-0"><i data-lucide="wheat" class="w-4 h-4"></i></div>'+
          '<div class="min-w-0 flex-1"><div class="flex items-center justify-between"><span class="font-medium text-slate-800 text-sm truncate">'+esc(c.nombre)+'</span>'+
          '<span class="text-xs text-slate-500 ml-2">'+c.integrantes+' pers.</span></div>'+
          '<div class="h-2 bg-slate-100 rounded-full overflow-hidden mt-1"><div class="h-full bg-amber-500 rounded-full" style="width:'+Math.max(w,4)+'%"></div></div>'+
          (alerta?'<span class="text-[11px] text-amber-600 flex items-center gap-1 mt-1"><i data-lucide="alert-circle" class="w-3 h-3"></i>Sin integrantes asignados</span>':'')+
          '</div>'+(finAuditor()?'<div class="text-right flex-shrink-0"><div class="text-[10px] text-slate-400">saldo</div><div class="text-sm font-semibold text-slate-700">'+dinero(c.saldo_caja)+'</div></div>':'')+'</div>';
      }).join('')+'</div>')+'</div>';
  }

  p.innerHTML=h; ri();
}

/* ---------- TESORERÍA ---------- */
var TZ = { cajas:[], cats:[], perfiles:[], caja:null, tab:'cajas' };

function fechaHora(f){ if(!f) return '-'; try{ return new Date(f).toLocaleString('es-HN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(e){ return '-'; } }
function mesActual(){ return new Date().toISOString().slice(0,7); }
function rangoMes(m){ var p=String(m||mesActual()).split('-'), a=parseInt(p[0],10), n=parseInt(p[1],10); return [p[0]+'-'+p[1]+'-01', new Date(a,n,0).toISOString().slice(0,10)]; }
function uid4(){ try{ return crypto.randomUUID(); }catch(e){ return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16);}); } }

function finAdmin(){ return puede(['admin','pastor','tesorero']); }
function finAuditor(){ return puede(['admin','pastor','tesorero','fiscal']); }
function esResp(c){ return !!(c && c.responsable_id && S.user && c.responsable_id===S.user.id); }
function puedeMover(c){ return finAdmin() || esResp(c); }
function cajaPorId(id){ return TZ.cajas.filter(function(c){ return c.id===id; })[0]||null; }
function icoCaja(c){ return c.tipo==='banco' ? 'landmark' : 'banknote'; }

async function tzCajas(f){ if(f||!TZ.cajas.length) TZ.cajas = await dbGet('v_cajas_saldos','select=*&order=orden.asc,nombre.asc'); return TZ.cajas; }
async function tzCats(f){ if(f||!TZ.cats.length) TZ.cats = await dbGet('caja_categorias','select=*&order=tipo.asc,orden.asc,nombre.asc'); return TZ.cats; }
async function tzPerfiles(){ if(!TZ.perfiles.length) TZ.perfiles = await dbGet('profiles','select=id,nombre,rol&order=nombre.asc'); return TZ.perfiles; }
function spin(){ return '<div class="text-center py-10 text-slate-400"><i data-lucide="loader-circle" class="w-7 h-7 mx-auto animate-spin"></i></div>'; }

async function view_treasury(){
  var p=document.getElementById('page');
  if(!finAuditor() && !S.misCajas){ p.innerHTML=vacio('lock','No tienes ninguna caja asignada.'); ri(); return; }
  var tabs=[['cajas','wallet','Cajas'],['movs','receipt','Movimientos'],['informe','file-bar-chart','Informe']];
  if(finAuditor()) tabs.push(['presupuesto','target','Presupuesto']);
  var mas=[];
  if(finAuditor()) mas.push(['recibos','receipt-text','Recibos de aportante']);
  mas.push(['arqueo','calculator','Arqueo de caja']);
  if(finAdmin()) mas.push(['cierre','lock','Cierre de mes']);
  if(finAdmin()) mas.push(['cats','tags','Categorías']);
  var tabH='<div class="flex gap-1 bg-slate-100 rounded-xl p-1 mb-5 relative">'+tabs.map(function(t){
      var a=TZ.tab===t[0];
      return '<button onclick="tzIrTab(\''+t[0]+'\')" class="flex-1 py-2.5 px-1 rounded-lg text-xs sm:text-sm font-semibold flex items-center justify-center gap-1 transition '+(a?'bg-white text-indigo-700 shadow-sm':'text-slate-500')+'"><i data-lucide="'+t[1]+'" class="w-4 h-4 flex-shrink-0"></i><span class="truncate hidden xs:inline sm:inline">'+t[2]+'</span></button>';
    }).join('');
  if(mas.length){
    var enMas=mas.some(function(m){ return m[0]===TZ.tab; });
    tabH+='<button onclick="tzToggleMas(event)" class="py-2.5 px-3 rounded-lg text-xs sm:text-sm font-semibold flex items-center gap-1 transition '+(enMas?'bg-white text-indigo-700 shadow-sm':'text-slate-500')+'"><i data-lucide="more-horizontal" class="w-4 h-4"></i></button>'+
      '<div id="tzMasMenu" class="hidden absolute right-1 top-full mt-1 bg-white rounded-xl shadow-xl border border-slate-200 py-1 z-40 min-w-[210px]">'+
      mas.map(function(m){ return '<button onclick="tzIrTab(\''+m[0]+'\')" class="w-full text-left px-4 py-2.5 text-sm hover:bg-slate-50 flex items-center gap-2.5 '+(TZ.tab===m[0]?'text-indigo-700 font-semibold':'text-slate-700')+'"><i data-lucide="'+m[1]+'" class="w-4 h-4"></i>'+m[2]+'</button>'; }).join('')+
      '</div>';
  }
  p.innerHTML=tabH+'</div><div id="tzBody">'+spin()+'</div>';
  ri();
  if(TZ.tab==='movs') await pintarMovs();
  else if(TZ.tab==='cats') await pintarCats();
  else if(TZ.tab==='informe') await pintarInforme();
  else if(TZ.tab==='presupuesto') await pintarPresupuesto();
  else if(TZ.tab==='recibos') await pintarRecibos();
  else if(TZ.tab==='arqueo') await pintarArqueos();
  else if(TZ.tab==='cierre') await pintarCierres();
  else if(TZ.caja) await tzVerCaja(TZ.caja);
  else await pintarCajas();
}
function tzToggleMas(e){ e.stopPropagation(); var m=document.getElementById('tzMasMenu'); if(m){ m.classList.toggle('hidden'); if(!m.classList.contains('hidden')){ setTimeout(function(){ document.addEventListener('click',function cerrar(){ m.classList.add('hidden'); document.removeEventListener('click',cerrar); }); },10); } } }
async function tzIrTab(t){ TZ.tab=t; TZ.caja=null; await view_treasury(); }
async function tzRefrescar(){
  await tzCajas(true);
  if(TZ.caja) await tzVerCaja(TZ.caja);
  else if(TZ.tab==='movs') await pintarMovs();
  else if(TZ.tab==='cats') await pintarCats();
  else await pintarCajas();
}

/* ----- Listado de cajas ----- */
async function pintarCajas(){
  var b=document.getElementById('tzBody'); b.innerHTML=spin(); ri();
  var cs=await tzCajas(true);
  var act=cs.filter(function(c){ return c.activa; });
  var h='';

  if(finAuditor()){
    var tot=0, ef=0, bk=0, ing=0, egr=0, nef=0, nbk=0;
    act.forEach(function(c){
      var s=Number(c.saldo)||0; tot+=s;
      ing+=Number(c.total_ingresos)||0; egr+=Number(c.total_egresos)||0;
      if(c.tipo==='banco'){ bk+=s; nbk++; } else { ef+=s; nef++; }
    });
    h+='<div class="rounded-2xl bg-gradient-to-br from-indigo-600 via-indigo-700 to-violet-700 text-white p-5 shadow-xl mb-5">'+
      '<div class="flex items-center gap-2 mb-1"><i data-lucide="vault" class="w-5 h-5 opacity-90"></i>'+
      '<span class="text-sm font-medium opacity-90">Caja General · Consolidado</span>'+
      '<span class="ml-auto text-[10px] bg-white/20 px-2 py-0.5 rounded-full flex items-center gap-1"><i data-lucide="eye-off" class="w-3 h-3"></i>Restringido</span></div>'+
      '<div class="text-3xl sm:text-4xl font-bold tracking-tight mb-4">'+dinero(tot)+'</div>'+
      '<div class="grid grid-cols-2 gap-3">'+
        '<div class="bg-white/15 rounded-xl p-3"><div class="flex items-center gap-1.5 text-xs opacity-90 mb-0.5"><i data-lucide="banknote" class="w-3.5 h-3.5"></i>Efectivo · '+nef+'</div><div class="text-lg font-bold">'+dinero(ef)+'</div></div>'+
        '<div class="bg-white/15 rounded-xl p-3"><div class="flex items-center gap-1.5 text-xs opacity-90 mb-0.5"><i data-lucide="landmark" class="w-3.5 h-3.5"></i>Banco · '+nbk+'</div><div class="text-lg font-bold">'+dinero(bk)+'</div></div>'+
      '</div>'+
      '<div class="flex gap-4 mt-3 text-xs opacity-90"><span class="flex items-center gap-1"><i data-lucide="trending-up" class="w-3.5 h-3.5"></i>Ingresos '+dinero(ing)+'</span>'+
      '<span class="flex items-center gap-1"><i data-lucide="trending-down" class="w-3.5 h-3.5"></i>Egresos '+dinero(egr)+'</span></div></div>';
  }

  if(finAdmin()){
    h+='<div class="flex flex-wrap gap-2 mb-5">'+
      '<button onclick="formCaja()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i>Nueva caja</button>'+
      '<button onclick="formTransferencia()" class="px-4 py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-semibold rounded-xl flex items-center gap-2"><i data-lucide="arrow-left-right" class="w-4 h-4"></i>Transferir</button>'+
      '</div>';
  }

  var g1=cs.filter(function(c){ return c.ambito==='general'; });
  var g2=cs.filter(function(c){ return c.ambito==='casa_de_pan'; });
  var g3=cs.filter(function(c){ return c.ambito==='ministerio'||c.ambito==='proyecto'; });
  h+=tzGrupo('Cajas de la iglesia','church',g1);
  h+=tzGrupo('Casas de Pan','wheat',g2);
  h+=tzGrupo('Ministerios y proyectos','target',g3);
  if(!cs.length) h+=vacio('wallet','Aún no hay cajas visibles para ti.');
  b.innerHTML=h; ri();
}
function tzGrupo(tit,ic,lista){
  if(!lista.length) return '';
  return '<div class="mb-6"><h4 class="text-sm font-bold text-slate-500 uppercase tracking-wide mb-3 flex items-center gap-2"><i data-lucide="'+ic+'" class="w-4 h-4"></i>'+tit+' <span class="text-slate-300">('+lista.length+')</span></h4>'+
    '<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">'+lista.map(tzCard).join('')+'</div></div>';
}
function tzCard(c){
  var banco = c.tipo==='banco';
  var s = Number(c.saldo)||0;
  return '<div class="bg-white rounded-2xl border '+(c.activa?'border-slate-200':'border-slate-200 opacity-60')+' p-4 hover:shadow-md transition cursor-pointer active:scale-[.99]" onclick="tzVerCaja(\''+c.id+'\')">'+
    '<div class="flex items-start gap-3 mb-3">'+
      '<div class="w-10 h-10 rounded-xl '+(banco?'bg-sky-100 text-sky-700':'bg-emerald-100 text-emerald-700')+' flex items-center justify-center flex-shrink-0"><i data-lucide="'+icoCaja(c)+'" class="w-5 h-5"></i></div>'+
      '<div class="min-w-0 flex-1"><h5 class="font-bold text-slate-800 truncate">'+esc(c.nombre)+'</h5>'+
      '<div class="flex items-center gap-1.5 flex-wrap mt-0.5">'+
        '<span class="text-[10px] px-1.5 py-0.5 rounded-md '+(banco?'bg-sky-50 text-sky-700':'bg-emerald-50 text-emerald-700')+' font-semibold uppercase">'+esc(c.tipo)+'</span>'+
        (c.activa?'':'<span class="text-[10px] px-1.5 py-0.5 rounded-md bg-slate-100 text-slate-500 font-semibold">Inactiva</span>')+
        (esResp(c)?'<span class="text-[10px] px-1.5 py-0.5 rounded-md bg-indigo-50 text-indigo-700 font-semibold">Mi caja</span>':'')+
      '</div></div>'+
      (finAdmin()?'<button onclick="event.stopPropagation();editarCaja(\''+c.id+'\')" class="p-1.5 hover:bg-slate-100 rounded-lg flex-shrink-0"><i data-lucide="pencil" class="w-4 h-4 text-slate-500"></i></button>':'')+
    '</div>'+
    '<div class="text-2xl font-bold '+(s<0?'text-red-600':'text-slate-800')+' mb-2">'+dinero(s)+'</div>'+
    '<div class="text-xs text-slate-500 space-y-1">'+
      '<div class="flex items-center gap-1.5 truncate"><i data-lucide="user-check" class="w-3.5 h-3.5 flex-shrink-0"></i>'+(c.responsable_nombre?esc(c.responsable_nombre):'<span class="text-amber-600">Sin responsable asignado</span>')+'</div>'+
      (banco&&c.banco?'<div class="flex items-center gap-1.5 truncate"><i data-lucide="credit-card" class="w-3.5 h-3.5 flex-shrink-0"></i>'+esc(c.banco)+(c.numero_cuenta?' · '+esc(c.numero_cuenta):'')+'</div>':'')+
      '<div class="flex items-center gap-1.5"><i data-lucide="receipt" class="w-3.5 h-3.5"></i>'+(c.n_movimientos||0)+' movimiento'+(Number(c.n_movimientos)===1?'':'s')+(c.ultimo_movimiento?' · último '+fecha(c.ultimo_movimiento):'')+'</div>'+
    '</div></div>';
}

/* ----- Detalle de una caja ----- */

  var banco=c.tipo==='banco', s=Number(c.saldo)||0, edit=puedeMover(c);
  b.innerHTML=
    '<button onclick="tzIrTab(\'cajas\')" class="mb-3 text-sm text-slate-500 hover:text-slate-800 flex items-center gap-1"><i data-lucide="chevron-left" class="w-4 h-4"></i>Todas las cajas</button>'+
    '<div class="bg-white rounded-2xl border border-slate-200 p-5 mb-4">'+
      '<div class="flex items-start gap-3 mb-4"><div class="w-12 h-12 rounded-xl '+(banco?'bg-sky-100 text-sky-700':'bg-emerald-100 text-emerald-700')+' flex items-center justify-center flex-shrink-0"><i data-lucide="'+icoCaja(c)+'" class="w-6 h-6"></i></div>'+

        '<button onclick="formMovimiento(\''+c.id+'\',\'egreso\')" class="py-2.5 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-xl flex items-center justify-center gap-1.5"><i data-lucide="arrow-up-from-line" class="w-4 h-4"></i>Egreso</button></div>'
        :'<div class="mt-4 text-xs bg-slate-50 text-slate-500 rounded-xl p-3 flex items-center gap-2"><i data-lucide="eye" class="w-4 h-4"></i>Solo lectura. Únicamente el responsable y la administración registran movimientos.</div>')+
    '</div>'+
    '<div class="flex gap-2 mb-3"><input id="tzMesC" type="month" value="'+mesActual()+'" onchange="pintarMovsCaja()" class="px-3 py-2 border border-slate-300 rounded-lg text-sm">'+
    '<button onclick="pintarMovsCaja()" class="px-3 py-2 bg-slate-200 hover:bg-slate-300 rounded-lg text-sm font-medium flex items-center gap-1.5"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button></div>'+
    '<div id="tzLista">'+spin()+'</div>';

async function pintarMovsCaja(){
  var el=document.getElementById('tzLista'); if(!el) return;
  el.innerHTML=spin(); ri();
  var r=rangoMes(document.getElementById('tzMesC').value);
  try{
    var d=await dbGet('v_movimientos','caja_id=eq.'+TZ.caja+'&fecha=gte.'+r[0]+'&fecha=lte.'+r[1]+'&select=*&order=fecha.desc,created_at.desc');
    el.innerHTML=listaMovs(d,false); ri();

async function formTransferencia(){
  if(!finAdmin()){ toast('Solo la administración puede transferir','warning'); return; }
  await tzCajas(); await tzCats();
  var cs=TZ.cajas.filter(function(c){ return c.activa; });
  if(cs.length<2){ toast('Necesitas al menos dos cajas','warning'); return; }
  var op=function(sel){ return cs.map(function(c){ return '<option value="'+c.id+'"'+(sel===c.id?' selected':'')+'>'+esc(c.nombre)+' · '+dinero(c.saldo)+'</option>'; }).join(''); };
  modal('mTr', mHead('Transferencia entre cajas','mTr')+
   '<form id="fTr" class="p-4 space-y-3">'+
   '<div><label class="text-sm font-medium">Desde *</label><select name="origen" required class="w-full mt-1 px-3 py-2.5 border border-slate-300 rounded-lg">'+op(cs[0].id)+'</select></div>'+
   '<div class="text-center text-slate-400"><i data-lucide="arrow-down" class="w-5 h-5 inline"></i></div>'+
   '<div><label class="text-sm font-medium">Hacia *</label><select name="destino" required class="w-full mt-1 px-3 py-2.5 border border-slate-300 rounded-lg">'+op(cs[1].id)+'</select></div>'+
   '<div class="grid grid-cols-2 gap-3">'+
     '<div><label class="text-sm font-medium">Monto *</label><input name="monto" type="number" step="0.01" min="0.01" required inputmode="decimal" class="w-full mt-1 px-3 py-2.5 border border-slate-300 rounded-lg"></div>'+
     '<div><label class="text-sm font-medium">Fecha *</label><input name="fecha" type="date" required value="'+hoy()+'" class="w-full mt-1 px-3 py-2.5 border border-slate-300 rounded-lg"></div>'+
   '</div>'+
   '<div><label class="text-sm font-medium">Descripción</label><input name="descripcion" placeholder="Ej: Entrega de ofrenda de Casa de Pan" class="w-full mt-1 px-3 py-2.5 border border-slate-300 rounded-lg"></div>'+
   mFoot('mTr','Transferir')+'</form>');
  document.getElementById('fTr').onsubmit=async function(e){
    e.preventDefault();
    var fd=new FormData(e.target);
    if(fd.get('origen')===fd.get('destino')){ toast('Elige dos cajas distintas','warning'); return; }
    try{
      var tid=uid4();
      var cIn=TZ.cats.filter(function(c){ return c.nombre==='Transferencia recibida'; })[0];
      var cOut=TZ.cats.filter(function(c){ return c.nombre==='Transferencia enviada'; })[0];
      var base={ monto:parseFloat(fd.get('monto')), fecha:fd.get('fecha'), metodo:'transferencia',
                 descripcion:fd.get('descripcion')||'Transferencia entre cajas', transferencia_id:tid, registrado_por:S.user.id };
      await dbPost('treasury',[
        Object.assign({},base,{ caja_id:fd.get('origen'),  tipo:'egreso',  categoria_id:cOut?cOut.id:null }),
        Object.assign({},base,{ caja_id:fd.get('destino'), tipo:'ingreso', categoria_id:cIn?cIn.id:null })
      ]);
      toast('Transferencia registrada','success'); closeModal('mTr'); await tzRefrescar();
    }catch(err){ toast(err.message.slice(0,140),'error'); }
  };
}

async function cargarMovs(){
  var el=document.getElementById('fLista'); if(!el) return;
  el.innerHTML=spin(); ri();
  var r=rangoMes(document.getElementById('fMes').value);
  var q='fecha=gte.'+r[0]+'&fecha=lte.'+r[1];
  var ca=document.getElementById('fCaja').value; if(ca) q+='&caja_id=eq.'+ca;
  var ti=document.getElementById('fTipo').value; if(ti) q+='&tipo=eq.'+ti;
  var ct=document.getElementById('fCat').value;  if(ct) q+='&categoria_id=eq.'+ct;
  try{
    var d=await dbGet('v_movimientos',q+'&select=*&order=fecha.desc,created_at.desc&limit=300');

    d.forEach(function(m){ if(m.tipo==='ingreso') ing+=Number(m.monto); else egr+=Number(m.monto); });
    document.getElementById('fTot').innerHTML=
      '<div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3"><div class="text-[11px] text-emerald-700">Ingresos</div><div class="font-bold text-emerald-700 text-sm sm:text-base">'+dinero(ing)+'</div></div>'+

    el.innerHTML=listaMovs(d,true); ri();
  }catch(e){ el.innerHTML='<div class="text-sm text-red-600 p-3">'+esc(e.message.slice(0,150))+'</div>'; }
}

/* ---------- PRESUPUESTO vs EJECUTADO ---------- */
async function pintarPresupuesto(){
  var b=document.getElementById('tzBody'); b.innerHTML=spin(); ri();
  try{
    var eje=await dbGet('v_presupuesto_ejecucion','anio=eq.'+FZ.anio+'&select=*&order=tipo.asc');
    await tzCats();
    var ing=eje.filter(function(x){return x.tipo==='ingreso';});
    var egr=eje.filter(function(x){return x.tipo==='egreso';});
    var sumaMeta=function(l){ return l.reduce(function(a,x){return a+Number(x.monto_anual);},0); };
    var sumaEje=function(l){ return l.reduce(function(a,x){return a+Number(x.ejecutado);},0); };
    var h='<div class="flex items-center gap-2 mb-4">'+
      '<select onchange="FZ.anio=parseInt(this.value);pintarPresupuesto()" class="px-3 py-2 border border-slate-300 rounded-lg text-sm font-medium">'+
      anios().map(function(a){ return '<option value="'+a+'"'+(a===FZ.anio?' selected':'')+'>Año '+a+'</option>'; }).join('')+'</select>'+
      (finAdmin()?'<button onclick="formPresupuesto()" class="ml-auto px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg text-sm flex items-center gap-1.5"><i data-lucide="plus" class="w-4 h-4"></i>Meta</button>':'')+'</div>';

    if(!eje.length){
      h+='<div class="bg-white rounded-2xl border border-slate-200 p-8 text-center text-slate-400"><i data-lucide="target" class="w-10 h-10 mx-auto mb-3 opacity-40"></i>'+
        '<p class="text-sm max-w-sm mx-auto">Define cuánto esperas recibir y gastar por categoría este año. Luego verás cuánto se ha cumplido de cada meta.</p>'+
        (finAdmin()?'<button onclick="formPresupuesto()" class="mt-4 px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-semibold">Crear primera meta</button>':'')+'</div>';
      b.innerHTML=h; ri(); return;
    }
    function bloque(tit,lista,col){
      if(!lista.length) return '';
      var meta=sumaMeta(lista), ej=sumaEje(lista), pct=meta?Math.round(ej/meta*100):0;
      return '<div class="mb-5"><div class="flex items-center justify-between mb-2"><h4 class="text-sm font-bold text-'+col+'-700 uppercase tracking-wide flex items-center gap-1.5"><i data-lucide="'+(col==='emerald'?'trending-up':'trending-down')+'" class="w-4 h-4"></i>'+tit+'</h4>'+
        '<span class="text-xs text-slate-500">'+dinero(ej)+' de '+dinero(meta)+' · '+pct+'%</span></div>'+
        '<div class="bg-white rounded-2xl border border-slate-200 divide-y divide-slate-100">'+lista.map(function(x){
          var p=x.pct==null?0:Number(x.pct);
          var barra = col==='egreso'
            ? (p>100?'bg-red-500':p>85?'bg-amber-500':'bg-emerald-500')
            : (p>=100?'bg-emerald-500':p>=60?'bg-indigo-500':'bg-slate-300');
          return '<div class="p-3.5"><div class="flex items-center justify-between mb-1.5"><span class="font-medium text-sm text-slate-800 capitalize flex items-center gap-1.5"><i data-lucide="'+esc(x.icono||'tag')+'" class="w-3.5 h-3.5 text-slate-400"></i>'+esc(x.categoria)+'</span>'+
            '<span class="text-sm '+(col==='egreso'&&p>100?'text-red-600 font-semibold':'text-slate-600')+'">'+dinero(x.ejecutado)+' / '+dinero(x.monto_anual)+'</span></div>'+
            '<div class="flex items-center gap-2"><div class="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full '+barra+' rounded-full transition-all" style="width:'+Math.min(p,100)+'%"></div></div>'+
            '<span class="text-xs font-semibold w-10 text-right '+(col==='egreso'&&p>100?'text-red-600':'text-slate-500')+'">'+p+'%</span>'+
            (finAdmin()?'<button onclick="formPresupuesto(\''+x.presupuesto_id+'\')" class="p-1 hover:bg-slate-100 rounded"><i data-lucide="pencil" class="w-3.5 h-3.5 text-slate-400"></i></button>':'')+'</div>'+
            (col==='egreso'&&p>100?'<p class="text-[11px] text-red-600 mt-1 flex items-center gap-1"><i data-lucide="alert-triangle" class="w-3 h-3"></i>Excedido en '+dinero(Number(x.ejecutado)-Number(x.monto_anual))+'</p>':'')+'</div>';
        }).join('')+'</div></div>';
    }
    h+=bloque('Ingresos proyectados',ing,'emerald')+bloque('Egresos presupuestados',egr,'egreso');
    b.innerHTML=h; ri();
  }catch(e){ b.innerHTML='<div class="text-sm text-red-600 p-3">'+esc(e.message.slice(0,150))+'</div>'; }
}

function pFiltrarCats(tp){
  var sel=document.getElementById('pCat');

  if(vis.length) sel.value=vis[0].value;
}

async function datosInforme(anio,mes){
  var cats=await dbGet('rpc/informe_categorias','',null).catch(function(){return null;});
  // rpc por POST:
  var r=await req('/rest/v1/rpc/informe_categorias',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({p_anio:anio,p_mes:mes}) });
  var categorias=r.ok?await r.json():[];
  var porCaja=await dbGet('v_informe_mensual','anio=eq.'+anio+'&mes=eq.'+mes+'&select=*');
  var cerrado=await dbGet('cierres_mes','anio=eq.'+anio+'&mes=eq.'+mes+'&select=*');
  return { anio:anio, mes:mes, categorias:categorias, porCaja:porCaja, cierre:cerrado[0]||null };
}

    '</div>'+
    '<div class="grid grid-cols-3 gap-3 mb-5 text-center">'+
      '<div class="bg-emerald-50 rounded-xl p-3"><div class="text-[11px] text-emerald-700 uppercase">Ingresos</div><div class="font-bold text-emerald-700">'+dinero(totIng)+'</div></div>'+

async function cerrarMes(){
  var mes=parseInt(document.getElementById('ciMes').value), anio=parseInt(document.getElementById('ciAnio').value);
  if(!confirm('¿Cerrar '+MES_L[mes]+' '+anio+'? Se bloquearán todos sus movimientos.'))return;
  try{
    var ini=anio+'-'+String(mes).padStart(2,'0')+'-01';
    var fin=new Date(anio,mes,0).toISOString().slice(0,10);
    var d=await dbGet('treasury','fecha=gte.'+ini+'&fecha=lte.'+fin+'&select=tipo,monto');
    var ing=0,egr=0; d.forEach(function(t){ if(t.tipo==='ingreso') ing+=Number(t.monto); else egr+=Number(t.monto); });
    await dbPost('cierres_mes',{ anio:anio, mes:mes, total_ingresos:ing, total_egresos:egr, saldo_cierre:ing-egr });
    toast('Mes cerrado','success'); pintarCierres();
  }catch(e){ toast(e.message.slice(0,140),'error'); }
}
async function reabrirMes(id,label){
  if(!confirm('¿Reabrir '+label+'? Volverá a permitir cambios en sus movimientos.'))return;
  try{ await dbDel('cierres_mes','id=eq.'+id); toast('Mes reabierto','success'); pintarCierres(); }
  catch(e){ toast(e.message.slice(0,140),'error'); }
}
